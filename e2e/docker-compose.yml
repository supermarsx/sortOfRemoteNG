services:
  test-ssh:
    image: lscr.io/linuxserver/openssh-server
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=${SSH_USER}
      - USER_PASSWORD=${SSH_PASSWORD}
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=true
    volumes:
      - ./fixtures:/fixtures:ro
      - ./fixtures/ssh-server-init.sh:/custom-cont-init.d/10-ssh-server:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-rdp:
    image: danielguerra/ubuntu-xrdp
    ports:
      - "13389:3389"
    environment:
      - TZ=UTC
    healthcheck:
      # danielguerra/ubuntu-xrdp ships no nc/ss/netstat; bash IS present and has
      # /dev/tcp net-redirection support, so this proves 3389 is actually listening.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/3389"]
      interval: 10s
      timeout: 5s
      retries: 15

  test-vnc:
    image: consol/rocky-xfce-vnc
    ports:
      - "15900:5901"
      - "16901:6901"
    environment:
      - VNC_PW=${VNC_PASSWORD}
      - VNC_RESOLUTION=1280x720
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5901"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-http:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Generated immediately before Compose by
      # scripts/ci/e2e-http-fixtures.mjs. No private key is committed.
      - ./.generated/http/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.generated/http/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./.generated/http/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-voip-phone:
    # Fake Yealink T2x web admin (t66): 8090 = legacy (HTTP Basic,
    # ConfigManApp.com), 8091 = servlet (login form + JSESSIONID).
    # ACTION_URI=1 makes `?key=Reboot` succeed; unset = 403 like a stock phone.
    image: node:20-alpine
    working_dir: /fixture
    command: ["node", "server.mjs"]
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - MODE=both
      - PORT_LEGACY=8090
      - PORT_SERVLET=8091
      - ACTION_URI=${VOIP_PHONE_ACTION_URI:-0}
    volumes:
      - ./fixtures/voip-phone:/fixture:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mysql:
    # MySQL 8 (t69). Seeded from fixtures/db/mysql/01-seed.sql on first init
    # (table people + view + procedure). Default auth = caching_sha2_password.
    image: mysql:8.0
    ports:
      - "13306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./fixtures/db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # mysqladmin ping answers before init SQL has run on first boot; the
      # `-u`/`-p` SELECT proves the seeded schema is queryable as the app user.
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e ''SELECT COUNT(*) FROM testdb.people'' >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  test-mariadb:
    # MariaDB 11 (t69). Same seed file as test-mysql (common SQL subset) so the
    # MySQL/MariaDB wdio specs and the parametrised Rust live test share data.
    # MARIADB_* mirror the MYSQL_* .env values; app user auth = mysql_native_password.
    image: mariadb:11
    ports:
      - "13307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=testdb
      - MARIADB_USER=${MYSQL_USER}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./fixtures/db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # healthcheck.sh ships in the image; --innodb_initialized is only true
      # after the init scripts have run, so "healthy" implies "seeded".
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-mongo:
    # MongoDB 7 (t69). fixtures/db/mongo/01-seed.js runs once as root on first
    # init: testdb.people (5 docs, index city_1) + `testuser` (readWrite testdb,
    # read admin). MONGO_USER/MONGO_PASSWORD are read by the seed script.
    image: mongo:7
    ports:
      - "27117:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=testdb
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./fixtures/db/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Authenticate as the seeded app user: proves both the server and the
      # init script (which creates that user) have completed.
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --host 127.0.0.1 -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  test-ftp:
    image: fauria/vsftpd
    ports:
      - "2121:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASSWORD}
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - PASV_ADDRESS=127.0.0.1
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/21"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-portainer:
    # Portainer CE (t64). Admin is pre-provisioned from a plaintext password
    # file generated by scripts/ci/e2e-portainer-fixture.mjs (Portainer locks
    # itself 5 minutes after first start if no admin exists). The docker.sock
    # mount gives Portainer a "local" environment so the containers list is
    # non-empty in tests.
    #
    # No `healthcheck:` block — the image is FROM scratch (no sh/wget/curl),
    # so nothing can probe from inside. Readiness is owned by
    # `node scripts/ci/e2e-portainer-fixture.mjs wait`, which polls
    # /api/system/status from the host and verifies the admin login.
    image: portainer/portainer-ce:lts
    ports:
      - "19000:9000"
      - "19443:9443"
    command:
      - "--admin-password-file"
      - "/run/portainer/admin_password"
      - "-H"
      - "unix:///var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.generated/portainer/admin_password:/run/portainer/admin_password:ro

  test-draytek:
    # Fake DrayTek Vigor (DrayOS) web admin (t68): 8092 = classic wlogin.cgi
    # (aa/ab base64, fw < 4.4), 8093 = sFormAuthStr token variant (fw >= 4.4).
    # DRAYTEK_RSA=1 turns 8093 into the RSA-login page the crate refuses.
    # Login admin/admin; status at /doc/status.sht; reboot POST /cgi-bin/reboot.cgi.
    image: node:20-alpine
    working_dir: /fixture
    command: ["node", "server.mjs"]
    ports:
      - "8092:8092"
      - "8093:8093"
    environment:
      - MODE=both
      - PORT_CLASSIC=8092
      - PORT_TOKEN=8093
      - RSA=${DRAYTEK_RSA:-0}
    volumes:
      - ./fixtures/draytek:/fixture:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-npm:
    # Nginx Proxy Manager (t65). Only the admin UI/API port (81) is published
    # as 18181; the proxying ports 80/443 are deliberately NOT mapped so the
    # fixture cannot collide with test-http (8080/8443) or a host web server.
    #
    # v2.10+ provisions the admin account from INITIAL_ADMIN_*. Older tags
    # ignore those and create the classic admin@example.com / changeme account
    # which NPM then forces to change on first login — that path is handled by
    # `node scripts/ci/e2e-npm-fixture.mjs wait`, which is also the readiness
    # gate that proves the API answers with the configured credentials.
    #
    # /data and /etc/letsencrypt must exist or the image's `prepare` service
    # aborts with "... is not mounted" (s6-rc.d/prepare/20-paths.sh only tests
    # `[ -d ... ]`). tmpfs satisfies that without a named volume, so the SQLite
    # database is RAM-backed and every `up` starts from a clean install with
    # nothing to prune afterwards.
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "18181:81"
    environment:
      - INITIAL_ADMIN_EMAIL=${NPM_ADMIN_EMAIL:-admin@example.com}
      - INITIAL_ADMIN_PASSWORD=${NPM_ADMIN_PASSWORD}
      - DISABLE_IPV6=true
    tmpfs:
      - /data:size=256m
      - /etc/letsencrypt:size=16m
    healthcheck:
      # /usr/bin/check-health is the image's own healthcheck helper (it hits
      # the local API and the nginx status page).
      test: ["CMD", "/usr/bin/check-health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
