name: CEF private owned Mac Nearby source proof
# Registration on main grants no main execution; only the exact reviewed branch
# can exercise this scratch fixture. No CEF acquisition or production admission.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cef-mac-nearby-proof-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mac-nearby-source-qualification-20261101' && github.repository_id == '1010282954' && github.repository == 'supermarsx/sortOfRemoteNG' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Start the original whole-job proof clock
        run: echo "CEF_MAC_NEARBY_JOB_STARTED_MS=$(($(date +%s) * 1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Prove only creation-owned Nearby literal metadata
        id: proof
        timeout-minutes: 3
        run: node tests/fixtures/cef/mac_nearby_source_carrier.mjs
      - name: Retain only the closed proof reports
        if: always() && steps.proof.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-nearby-owned-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.proof.outputs.root }}/proof.json
            ${{ steps.proof.outputs.root }}/carrier.json
          if-no-files-found: warn
          retention-days: 14
