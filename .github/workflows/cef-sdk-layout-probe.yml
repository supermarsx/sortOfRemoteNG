            };
            let failed = false,
              first,
              phase = "selection",
              selectionPins = [];
            const outcome = {
              schemaVersion: 1,
              kind: "sorng-macarm-passive-external-census",
              head: env.GITHUB_SHA,
              target: profile.target,
              hostArchitecture: process.arch,
              sourceWriteAdmitted: false,
              sourceAccepted: false,
              runnerImage: Object.fromEntries(
                ["ImageOS", "ImageVersion"].map((key) => [
                  key,
                  /^[A-Za-z0-9_.-]{1,96}$/.test(env[key] ?? "") ? env[key] : null,
                ]),
              ),
              sourceAcquisition: false,
              checkpointReady: false,
              nativeAcceptance: false,
              runtimeReady: false,
              publication: false,
              sourceWritten: false,
              installedInputsWrittenByCapability: false,
              externalCensusWritesInstalledInputs: false,
              metalPreparationDownloaded: null,
