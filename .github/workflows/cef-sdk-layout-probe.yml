          async function readCapability(
            file,
            pin,
            check,
            expectedRoot,
            io = { lstat, open },
            uid = process.getuid(),
          ) {
            check();
            assert(
              /^\/Users\/runner\/work\/_temp\/cef-mac-inputs-[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}\/capability\.json$/.test(
                file,
              ),
              "CENSUS_CAPABILITY_PATH",
            );
            assert(
              pin?.name === "capability.json" &&
                Number.isSafeInteger(pin.bytes) &&
                pin.bytes > 0 &&
                pin.bytes <= 65536 &&
                /^[a-f0-9]{64}$/.test(pin.sha256),
              "CENSUS_CAPABILITY_PIN",
            );
            const rootNow = await io.lstat(path.posix.dirname(file), { bigint: true });
            const rootSame = (value) =>
              value.isDirectory() &&
              value.uid === BigInt(uid) &&
              (value.mode & 0o777n) === 0o700n &&
              ["dev", "ino", "mode", "uid", "gid", "birthtimeNs"].every(
                (key) => value[key] === expectedRoot?.[key],
              );
            assert(rootSame(rootNow), "CENSUS_CAPABILITY_PARENT");
            const before = await io.lstat(file, { bigint: true });
            assert(
              before.isFile() &&
                before.nlink === 1n &&
                before.uid === BigInt(uid) &&
                (before.mode & 0o022n) === 0n &&
                before.size === BigInt(pin.bytes),
              "CENSUS_CAPABILITY_FILE",
            );
            const fd = await io.open(file, constants.O_RDONLY | constants.O_NOFOLLOW);
            let failed = false,
              first,
              value;
            const same = (a, b) =>
              [
                "dev",
                "ino",
                "mode",
                "uid",
                "gid",
                "nlink",
                "size",
                "mtimeNs",
                "ctimeNs",
                "birthtimeNs",
              ].every((k) => a[k] === b[k]);
            try {
              assert(
                same(before, await fd.stat({ bigint: true })),
                "CENSUS_CAPABILITY_IDENTITY",
              );
              check();
              const buffer = Buffer.alloc(pin.bytes + 1);
              let count = 0;
              while (count < buffer.length) {
                check();
                const { bytesRead } = await fd.read(
                  buffer,
                  count,
                  buffer.length - count,
                  count,
                );
                check();
                assert(
                  Number.isSafeInteger(bytesRead) &&
                    bytesRead >= 0 &&
                    bytesRead <= buffer.length - count,
                  "CENSUS_CAPABILITY_BOUND",
                );
                if (!bytesRead) break;
                count += bytesRead;
                assert(count <= pin.bytes, "CENSUS_CAPABILITY_BOUND");
              }
              const body = buffer.subarray(0, count);
              check();
              assert(
                body.length === pin.bytes &&
                  createHash("sha256").update(body).digest("hex") === pin.sha256,
                "CENSUS_CAPABILITY_HASH",
              );
              value = JSON.parse(body);
              assert(
                same(before, await fd.stat({ bigint: true })) &&
                  same(before, await io.lstat(file, { bigint: true })) &&
                  rootSame(await io.lstat(path.posix.dirname(file), { bigint: true })),
                "CENSUS_CAPABILITY_IDENTITY",
              );
              assert(
                value?.schemaVersion === 1 &&
                  value.kind === "sorng-macarm-owned-capability-observation" &&
                  value.target === "aarch64-apple-darwin" &&
                  value.complete === true &&
                  value.cleanupConfirmed === true &&
                  value.objectsRemoved === true &&
                  value.handlesClosed === true &&
                  value.error === null &&
                  value.sourceWriteAdmitted === false &&
                  value.installedInputsWritten === false &&
                  value.nativeAcceptance === false &&
                  value.runtimeReady === false &&
                  Array.isArray(value.rows) &&
                  value.rows.length === 12,
                "CENSUS_CAPABILITY_REPORT",
              );
              assert(
                Object.keys(value).sort().join() ===
                  [
                    "schemaVersion",
                    "kind",
                    "target",
                    "complete",
                    "rows",
                    "cleanupConfirmed",
                    "objectsRemoved",
                    "handlesClosed",
                    "sourceWriteAdmitted",
                    "error",
                    "installedInputsWritten",
                    "nativeAcceptance",
                    "runtimeReady",
                  ]
                    .sort()
                    .join(),
                "CENSUS_CAPABILITY_KEYS",
              );
              const fields = [
                "dev",
                "ino",
                "mode",
                "nlink",
                "size",
                "uid",
                "gid",
                "atime_ns",
                "mtime_ns",
                "ctime_ns",
              ];
              const integer = (value) =>
                typeof value === "string" &&
                /^(?:0|[1-9][0-9]{0,31}|-[1-9][0-9]{0,30})$/.test(value);
              const observedStat = (value) =>
                value &&
                Object.keys(value).sort().join() ===
                  [...fields, "birthtimeNsAvailable", "birthtimeNs"].sort().join() &&
                fields.every((key) => integer(value[key])) &&
                typeof value.birthtimeNsAvailable === "boolean" &&
                (value.birthtimeNsAvailable
                  ? integer(value.birthtimeNs)
                  : value.birthtimeNs === null);
              const keys = new Set();
              for (const row of value.rows) {
                assert(
                  Object.keys(row).sort().join() ===
                    [
                      "role",
                      "case",
                      "requestedMtimeNs",
                      "before",
                      "after",
                      "heldBefore",
                      "heldAfter",
                      "exactMtimeReadback",
                    ]
                      .sort()
                      .join() &&
                    ["file", "directory", "root", "symlink"].includes(row.role) &&
                    ["no-op", "past", "future"].includes(row.case) &&
                    typeof row.exactMtimeReadback === "boolean" &&
                    integer(row.requestedMtimeNs) &&
                    observedStat(row.before) &&
                    observedStat(row.after) &&
                    (row.role === "symlink"
                      ? row.heldBefore === null && row.heldAfter === null
                      : observedStat(row.heldBefore) && observedStat(row.heldAfter)),
                  "CENSUS_CAPABILITY_ROW",
                );
                keys.add(row.role + ":" + row.case);
              }
              assert(keys.size === 12, "CENSUS_CAPABILITY_ROWS");
            } catch (error) {
              failed = true;
              first = error;
            } finally {
              try {
                await fd.close();
              } catch (error) {
                if (!failed) {
                  failed = true;
                  first = error;
                }
              }
            }
            if (failed) throw first;
            return value;
          }
          async function runExternalCensus() {
            censusAuthority(process.env);
            const clock = censusClock(),
              env = process.env,
              profile = checkpointHost(
                "aarch64-apple-darwin",
                process.platform,
                process.arch,
              );
            clock.remaining();
            assert(
              (await realpath(env.RUNNER_TEMP)) === env.RUNNER_TEMP,
              "CENSUS_TEMP_ALIAS",
            );
            const output = path.posix.join(
              env.RUNNER_TEMP,
              "cef-mac-inputs-" + randomUUID(),
            );
            await mkdir(output, { mode: 0o700 });
            const root = await lstat(output, { bigint: true });
            assert(
              root.isDirectory() &&
                root.uid === BigInt(process.getuid()) &&
                (root.mode & 0o777n) === 0o700n &&
                (await realpath(output)) === output,
              "CENSUS_OUTPUT",
            );
            await appendFile(env.GITHUB_OUTPUT, `census_root=${output}\n`);
            const put = async (name, value, cleanup = false) => {
              (cleanup ? clock.cleanup : clock.remaining)();
              const b = Buffer.from(canonical(value) + "\n");
              assert(b.length <= 65536, "CENSUS_PRIVATE_RECORD_BOUND");
              await writeFile(path.posix.join(output, name), b, {
                flag: "wx",
                mode: 0o600,
              });
