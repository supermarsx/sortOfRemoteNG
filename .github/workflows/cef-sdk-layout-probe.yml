name: CEF selected SDK layout probe
# Default read-only diagnostics. Explicit Metal opt-in permits only the existing
# fixed missing-component download; never Chromium acquisition or runtime authority.
on:
  workflow_dispatch:
    inputs:
      external_census:
        description: "Observe closed ARM-target Mac external inputs and owned timestamp capabilities; permits reviewed fixed Metal preparation"
        type: boolean
        required: false
        default: false
      metal_tools:
        description: "Observe selected Apple Metal commands; permits the existing fixed missing-component download"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cef-sdk-layout-probe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && ((inputs.external_census == true && github.repository == 'supermarsx/sortOfRemoteNG' && github.ref == 'refs/heads/codex/ci-mac-external-census-20261026') || (inputs.external_census != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: macos-15-intel
    timeout-minutes: ${{ (inputs.metal_tools || inputs.external_census) && 15 || 10 }}
    env:
      CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SORNG_CEF_TOOLS_ROOT: /
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Prepare existing fixed reviewed native prerequisites
        if: inputs.external_census != true
        run: node scripts/cef-hosted-provision.mjs --target x86_64-apple-darwin --output "$RUNNER_TEMP/cef-sdk-probe-prerequisites" --execute
      - name: Probe selected native SDK links without acquiring sources
        if: inputs.external_census != true
        run: node scripts/cef-engineering-checkpoint.mjs probe-sdk 2>&1 | tee "$RUNNER_TEMP/cef-sdk-layout-probe.log"
      - name: Diagnose selected Apple Metal tools
        if: inputs.metal_tools == true && inputs.external_census != true
        env:
          METAL_TOOLS_ENABLED: ${{ inputs.metal_tools }}
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { mkdir, open, readFile, realpath, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          import { plan, validateRunnerMap, buildEnvironment } from './scripts/cef-runtime-ci.mjs';
          import { checkpointHost, sdkProbeAuthority } from './scripts/lib/cef-engineering-checkpoint.mjs';
          import { verifyToolchainFiles, identitySha256 } from './scripts/lib/browser-custom-runtime.mjs';
          import { prepareMacMetalToolchain, macMetalFingerprint } from './scripts/cef-hosted-provision.mjs';

          // No argv, environment, Error.message or stack is written. Original tool output
          // is retained privately as bounded returned bytes/text, never echoed to the job console.
          function metalCommandStage(executable, args) {
            const same = (value) => JSON.stringify(value) === JSON.stringify(args);
            if (executable === '/usr/bin/xcrun') {
              if (same(['--no-cache', '--sdk', 'macosx', '--find', 'metal'])) return 'find-metal';
              if (same(['--no-cache', '--sdk', 'macosx', '--find', 'metallib'])) return 'find-metallib';
              if (same(['--no-cache', '--sdk', 'macosx', 'metal', '--version'])) return 'metal-version';
            }
            if (executable === '/usr/bin/xcodebuild' && same(['-downloadComponent', 'MetalToolchain'])) return 'download-component';
            if (executable === '/usr/bin/codesign' && args.length === 5 &&
                JSON.stringify(args.slice(0, 4)) === JSON.stringify(['--verify', '--strict', '--all-architectures', '-R=anchor apple'])) {
              const file = args[4];
              if (typeof file === 'string' && path.posix.isAbsolute(file) && Buffer.byteLength(file) <= 2048 && !/[\x00-\x1f\x7f]/.test(file)) {
                if (path.posix.basename(file) === 'metal') return 'verify-metal-signature';
                if (['metallib', 'air-lld'].includes(path.posix.basename(file))) return 'verify-metallib-signature';
              }
            }
            throw new Error('METAL_DIAGNOSTIC_COMMAND_DENIED');
          }
          function observeMetalExec(execute, persist, now = () => performance.now()) {
            let count = 0;
            return async (executable, args, options) => {
              const stage = metalCommandStage(executable, args);
              if (++count > 32 || !Number.isSafeInteger(options.timeout) || options.timeout < 1 || options.timeout > 600000)
                throw new Error('METAL_DIAGNOSTIC_COMMAND_BOUND');
              const begin = now();
              let result, originalError, failed = false;
              try { result = await execute(executable, args, options); }
              catch (error) { failed = true; originalError = error; }
              const value = failed ? originalError : result;
              const captured = (data) => {
                const bytes = Buffer.isBuffer(data) ? data : Buffer.from(typeof data === 'string' ? data : '');
                return { bytes: bytes.subarray(0, 65536), observed: bytes.length, truncated: bytes.length > 65536 };
              };
              const stdout = captured(value?.stdout), stderr = captured(value?.stderr);
              const signals = new Set(['SIGTERM', 'SIGKILL', 'SIGABRT', 'SIGSEGV', 'SIGBUS', 'SIGINT']);
              const record = { schemaVersion: 1, index: count, stage, timeoutMs: options.timeout,
                elapsedMs: Math.max(0, Math.floor(now() - begin)), result: failed ? 'failed' : 'success',
                exit: failed ? (Number.isSafeInteger(value?.code) && value.code >= 0 && value.code <= 2147483647 ? value.code : null) : 0,
                signal: signals.has(value?.signal) ? value.signal : null,
                stdoutBytes: stdout.bytes.length, stdoutObservedBytes: stdout.observed, stdoutTruncated: stdout.truncated,
                stderrBytes: stderr.bytes.length, stderrObservedBytes: stderr.observed, stderrTruncated: stderr.truncated };
              try { await persist(record, stdout.bytes, stderr.bytes); }
              catch { if (!failed) throw new Error('METAL_DIAGNOSTIC_PERSIST_FAILED'); }
              if (failed) throw originalError;
              return result;
            };
          }
          function observeMetalRealpath(resolve, persist, developerDir, now = () => performance.now()) {
            let count = 0;
            const bounded = (value) => {
              if (typeof value !== 'string') return {value:null,bytes:0,truncated:false};
              const bytes = Buffer.from(value);
              let text = bytes.subarray(0, 2048).toString('utf8');
              while (Buffer.byteLength(text) > 2048) text = text.slice(0, -1);
              return {value:text,bytes:bytes.length,truncated:bytes.length>2048};
            };
            return async (input) => {
              if (++count > 32) throw new Error('METAL_DIAGNOSTIC_REALPATH_BOUND');
              const stage = input === developerDir ? 'selected-developer' :
                typeof input === 'string' && path.posix.basename(input) === 'metal' ? 'metal' :
                typeof input === 'string' && path.posix.basename(input) === 'metallib' ? 'metallib' : 'other-tool';
              const began = now();
              let result, originalError, failed = false;
              try { result = await resolve(input); }
              catch (error) { failed = true; originalError = error; }
              const raw = bounded(input), canonical = bounded(result);
              const codes = new Set(['ENOENT', 'EACCES', 'ELOOP', 'ENOTDIR', 'ENAMETOOLONG']);
              const row = {schemaVersion:1,index:count,stage,result:failed?'failed':'success',
                elapsedMs:Math.max(0,Math.floor(now()-began)),input:raw.value,inputBytes:raw.bytes,inputTruncated:raw.truncated,
                canonical:canonical.value,canonicalBytes:canonical.bytes,canonicalTruncated:canonical.truncated,
                failureCode:failed?(codes.has(originalError?.code)?originalError.code:'OTHER'):null};
              try { await persist(row); }
              catch { if (!failed) throw new Error('METAL_DIAGNOSTIC_PERSIST_FAILED'); }
              if (failed) throw originalError;
              return result;
            };
          }
          async function runMetalDiagnostic() {
            sdkProbeAuthority(process.env);
            if (process.env.METAL_TOOLS_ENABLED !== 'true' || process.platform !== 'darwin' || process.arch !== 'x64')
              throw new Error('METAL_DIAGNOSTIC_OPT_IN_HOST_REQUIRED');
            const target = 'x86_64-apple-darwin';
            const profile = checkpointHost(target, process.platform, process.arch);
            const temporary = await realpath(process.env.RUNNER_TEMP);
            const output = path.join(temporary, 'cef-metal-tools-probe');
            await mkdir(output, { mode: 0o700 });
            if (await realpath(output) !== output) throw new Error('METAL_DIAGNOSTIC_OUTPUT_DENIED');
            const log = await open(path.join(output, 'commands.jsonl'), 'wx', 0o600);
            const began = performance.now();
            let phase = 'plan', originalError, failed = false, realpathLog;
            let outcome = { schemaVersion: 1, diagnosticOnly: true, nativeAcceptance: false, chromiumAcquisition: false };
            const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
            try {
              const planned = await plan({ inputs: profile.inputs, target, checkout: process.cwd(), runnerMode: 'hosted' });
              const { sourceLock, inputsRoot } = planned;
              if (identitySha256(sourceLock) !== profile.source) throw new Error('METAL_DIAGNOSTIC_TOOL_MAP_DENIED');
              phase = 'selected-tool-map';
              const build = sourceLock.builds.find((row) => row.target === target);
              const toolBytes = await readFile(path.join(inputsRoot, build.toolchainLock.path));
              if (digest(toolBytes) !== build.toolchainLock.sha256) throw new Error('METAL_DIAGNOSTIC_TOOL_MAP_DENIED');
              const tools = JSON.parse(toolBytes);
              const mapPin = tools.files.find((row) => row.path === 'cef-ci-runner-x86_64-apple-darwin.json');
              const mapBytes = await readFile(path.join(inputsRoot, mapPin.path));
              if (mapBytes.length !== mapPin.size || digest(mapBytes) !== mapPin.sha256) throw new Error('METAL_DIAGNOSTIC_TOOL_MAP_DENIED');
              const runner = validateRunnerMap(JSON.parse(mapBytes), target);
              const toolsRoot = await realpath(process.env.SORNG_CEF_TOOLS_ROOT);
              if (toolsRoot !== '/') throw new Error('METAL_DIAGNOSTIC_TOOL_MAP_DENIED');
              const python = path.join(toolsRoot, runner.python);
              phase = 'selected-tool-pins';
              const checkedTools = await verifyToolchainFiles({sourceLock,target,inputsRoot,toolsRoot,python,runnerMapFromInputs:true});
              if (checkedTools.filesVerified !== tools.files.length) throw new Error('METAL_DIAGNOSTIC_TOOL_MAP_DENIED');
              outcome = {...outcome,selection:{target,sourceLockIdentity:identitySha256(sourceLock),runnerMapSha256:mapPin.sha256,
                toolchainLockSha256:build.toolchainLock.sha256,filesVerified:checkedTools.filesVerified}};
              const child = buildEnvironment(runner, {toolsRoot,source:output,depot:output,python}, process.env);
              phase = 'metal-helper';
              const observedExec = observeMetalExec(promisify(execFile), async (row, stdout, stderr) => {
                const name = String(row.index).padStart(3, '0');
                await writeFile(path.join(output, `command-${name}.stdout`), stdout, {flag:'wx',mode:0o600});
                await writeFile(path.join(output, `command-${name}.stderr`), stderr, {flag:'wx',mode:0o600});
                await log.writeFile(JSON.stringify(row) + '\n');
              });
              realpathLog = await open(path.join(output, 'realpaths.jsonl'), 'wx', 0o600);
              const observedRealpath = observeMetalRealpath(realpath, (row) => realpathLog.writeFile(JSON.stringify(row)+'\n'), child.DEVELOPER_DIR);
              const observation = await prepareMacMetalToolchain({platform:process.platform,
                selected:{DEVELOPER_DIR:child.DEVELOPER_DIR,SDKROOT:child.SDKROOT},env:process.env,allowDownload:true,
                remainingMilliseconds:()=>600000-(performance.now()-began)}, {exec:observedExec,realpath:observedRealpath});
              const fingerprint = macMetalFingerprint(observation);
              outcome = {...outcome, result:'success', downloaded:observation.downloaded,
                componentResourceClosureVerified:false, nativeCompatibilityVerified:false,
                fingerprint:{provenance:fingerprint.provenance,tools:fingerprint.tools}};
            } catch (error) {
              failed = true; originalError = error;
              const reasons = new Set(['MAC_METAL_COMMAND_FAILED', 'MAC_METAL_COMPONENT_DRIFT', 'MAC_METAL_DEADLINE',
              'MAC_METAL_DOWNLOAD_POLICY', 'MAC_METAL_FILE_BOUND', 'MAC_METAL_FILE_CHANGED', 'MAC_METAL_OBSERVATION',
              'MAC_METAL_PROBE_FAILED', 'MAC_METAL_RESOLVED_PATH', 'MAC_METAL_SELECTED_ENV', 'MAC_METAL_UNAVAILABLE',
              'MAC_METAL_VERSION_BOUND', 'MAC_METAL_VERSION_MISSING', 'METAL_DIAGNOSTIC_TOOL_MAP_DENIED',
              'METAL_DIAGNOSTIC_COMMAND_DENIED', 'METAL_DIAGNOSTIC_COMMAND_BOUND', 'METAL_DIAGNOSTIC_REALPATH_BOUND', 'METAL_DIAGNOSTIC_PERSIST_FAILED']);
              const reason = reasons.has(error?.message) ? error.message : 'UNCLASSIFIED';
              outcome = {...outcome,result:'failed',phase,reason};
            } finally {
              let persistFailed = false;
              try { await writeFile(path.join(output,'outcome.json'),JSON.stringify(outcome)+'\n',{flag:'wx',mode:0o600}); }
              catch { persistFailed = true; }
              try { await log.close(); } catch { persistFailed = true; }
              try { await realpathLog?.close(); } catch { persistFailed = true; }
              if (persistFailed && !failed) throw new Error('METAL_DIAGNOSTIC_PERSIST_FAILED');
            }
            if (failed) throw originalError;
          }
          try { await runMetalDiagnostic(); } catch { console.error('METAL_DIAGNOSTIC_FAILED'); process.exitCode = 1; }
          NODE
      - name: Observe closed Mac external inputs and owned capabilities
        id: external_census
        if: inputs.external_census == true
        env:
          EXTERNAL_CENSUS_ENABLED: ${{ inputs.external_census }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFile } from "node:child_process";
          import { promisify } from "node:util";
          import { randomUUID, createHash } from "node:crypto";
          import { constants } from "node:fs";
          import {
            mkdir,
            lstat,
            open,
            readFile,
            realpath,
            writeFile,
            appendFile,
          } from "node:fs/promises";
          import path from "node:path";
          import {
            plan,
            validateRunnerMap,
            assertHostedBuildIdentity,
          } from "./scripts/cef-runtime-ci.mjs";
          import {
            checkpointHost,
            canonical,
          } from "./scripts/lib/cef-engineering-checkpoint.mjs";
          import {
            verifyToolchainFiles,
            identitySha256,
          } from "./scripts/lib/browser-custom-runtime.mjs";
          import {
            prepareMacMetalToolchain,
            macMetalFingerprint,
          } from "./scripts/cef-hosted-provision.mjs";
          import {
            macExternalObservationPlan,
            macSdkRelation,
            readMacExternalObservation,
            macExternalToolsBinding,
            macExternalObservationEvidence,
          } from "./scripts/lib/cef-mac-source-metadata.mjs";

          const CENSUS_BRANCH = "codex/ci-mac-external-census-20261026";
          function censusAuthority(
            env,
            platform = process.platform,
            arch = process.arch,
          ) {
            assert(
              env.EXTERNAL_CENSUS_ENABLED === "true" &&
                env.GITHUB_EVENT_NAME === "workflow_dispatch" &&
                env.GITHUB_ACTIONS === "true" &&
                env.RUNNER_ENVIRONMENT === "github-hosted" &&
                env.GITHUB_REPOSITORY_VISIBILITY === "public" &&
                env.GITHUB_REPOSITORY === "supermarsx/sortOfRemoteNG" &&
                env.GITHUB_REF === `refs/heads/${CENSUS_BRANCH}` &&
                env.GITHUB_WORKFLOW_REF ===
                  `supermarsx/sortOfRemoteNG/.github/workflows/cef-sdk-layout-probe.yml@refs/heads/${CENSUS_BRANCH}` &&
                /^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? "") &&
                ["GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"].every((k) =>
                  /^[1-9][0-9]*$/.test(env[k] ?? ""),
                ) &&
                env.RUNNER_TEMP === "/Users/runner/work/_temp" &&
                !env.GH_TOKEN &&
                !env.GITHUB_TOKEN &&
                platform === "darwin" &&
                arch === "x64",
              "CENSUS_AUTHORITY",
            );
          }
          function censusClock(now = () => performance.now(), wall = () => Date.now()) {
            const workEnd = now() + 600000,
              wallEnd = wall() + 600000,
              cleanupEnd = workEnd + 30000,
              wallCleanupEnd = wallEnd + 30000;
            const remaining = () => {
              const n = Math.floor(Math.min(workEnd - now(), wallEnd - wall()));
              assert(Number.isSafeInteger(n) && n > 0, "CENSUS_DEADLINE");
              return n;
            };
            const cleanup = () => {
              const n = Math.floor(Math.min(cleanupEnd - now(), wallCleanupEnd - wall()));
              assert(Number.isSafeInteger(n) && n > 0, "CENSUS_CLEANUP_UNCONFIRMED");
              return n;
            };
            return { remaining, cleanup };
          }
          function censusAppleTimeout(file, args, options, remaining, commandIndex) {
            const firstSdkPath = commandIndex === 1 &&
              file === "/usr/bin/xcrun" &&
              JSON.stringify(args) === JSON.stringify(["-sdk", "macosx", "--show-sdk-path"]);
            const timeout = Math.floor(Math.min(firstSdkPath ? 30000 : options.timeout, remaining()));
            assert(Number.isSafeInteger(timeout) && timeout > 0, "CENSUS_APPLE_DEADLINE");
            return timeout;
          }
          function fixedAppleCommand(file, args) {
            const vector = JSON.stringify(args);
            const allowed =
              (file === "/usr/bin/xcrun" &&
                [
                  ["-sdk", "macosx", "--show-sdk-path"],
                  ["-sdk", "macosx", "--show-sdk-platform-path"],
                  ["--no-cache", "--sdk", "macosx", "--find", "metal"],
                  ["--no-cache", "--sdk", "macosx", "--find", "metallib"],
                  ["--no-cache", "--sdk", "macosx", "metal", "--version"],
                ].some((v) => JSON.stringify(v) === vector)) ||
              (file === "/usr/bin/xcode-select" &&
                vector === JSON.stringify(["-print-path"])) ||
              (file === "/usr/bin/xcodebuild" &&
                vector === JSON.stringify(["-downloadComponent", "MetalToolchain"])) ||
              (file === "/usr/bin/codesign" &&
                args.length === 5 &&
                JSON.stringify(args.slice(0, 4)) ===
                  JSON.stringify([
                    "--verify",
                    "--strict",
                    "--all-architectures",
                    "-R=anchor apple",
                  ]) &&
                typeof args[4] === "string" &&
                args[4].length <= 2048 &&
                !/[\x00-\x1f\x7f]/.test(args[4]) &&
                /\/(?:metal|metallib|air-lld)$/.test(args[4]) &&
                path.posix.isAbsolute(args[4]));
            assert(allowed, "CENSUS_APPLE_COMMAND");
          }
          // This adapter has exactly two shared-worker modes, not a command/argv interface.
          function censusWorker(
            selected,
            mode,
            contextFile,
            remaining,
            cleanup,
            persist,
            execute = execFile,
            now = () => performance.now(),
          ) {
            assert(
              ["mac-owned-capability-observe", "mac-external-observe"].includes(mode),
              "CENSUS_WORKER_MODE",
            );
            assert(
              contextFile === selected.context.outputRoot + "/context.json",
              "CENSUS_WORKER_CONTEXT",
            );
            const args = selected.argv(mode, contextFile);
            assert(
              args.length === 10 &&
                JSON.stringify(args.slice(0, 4)) ===
                  JSON.stringify([
                    "-I",
                    "-B",
                    "scripts/lib/cef-checkpoint-archive.py",
                    mode,
                  ]) &&
                args[4] === "--input" &&
                args[5] === contextFile &&
                args[6] === "--output" &&
                args[7] ===
                  selected.context.outputRoot +
                    (mode === "mac-external-observe"
                      ? "/external.json"
                      : "/capability.json") &&
                args[8] === "--seconds" &&
                /^[1-9][0-9]*$/.test(args[9]),
              "CENSUS_WORKER_ARGV",
            );
            const timeout = Math.floor(
              Math.min(
                mode === "mac-owned-capability-observe" ? 5000 : 600000,
                remaining(),
              ),
            );
            assert(
              Number.isSafeInteger(timeout) && timeout > 0,
              "CENSUS_WORKER_DEADLINE",
            );
            const end = now() + timeout,
              cleanupEnd = Math.min(end + 30000, now() + cleanup());
            return new Promise((resolve, reject) => {
              let child,
                workTimer,
                cleanupTimer,
                closed = false,
                exited = false,
                callbackDone = false,
                finalizing = false,
                settled = false,
                pendingPersistences = 0,
                timeoutPersistence = null,
                failed = false,
                first,
                stdout = "",
                stderr = "";
              const live = {
                stdout: { observed: 0, parts: [], bytes: 0 },
                stderr: { observed: 0, parts: [], bytes: 0 },
              };
              const collect = (name, data) => {
                const b = Buffer.isBuffer(data) ? data : Buffer.from(data);
                const row = live[name];
                row.observed += b.length;
                const keep = b.subarray(0, Math.max(0, 65536 - row.bytes));
                if (keep.length) {
                  row.parts.push(keep);
                  row.bytes += keep.length;
                }
              };
              const capture = (name, value) => {
                const row = live[name];
                const b = Buffer.isBuffer(value)
                  ? value
                  : Buffer.from(typeof value === "string" ? value : "");
                return row.observed
                  ? {
                      bytes: Buffer.concat(row.parts),
                      observed: row.observed,
                      truncated: row.observed > 65536,
                    }
                  : {
                      bytes: b.subarray(0, 65536),
                      observed: b.length,
                      truncated: b.length > 65536,
                    };
              };
              const fail = (error) => {
                if (!settled && !failed) {
                  failed = true;
                  first = error;
                }
              };
              const kill = () => {
                if (!exited && child?.pid)
                  try {
                    child.kill("SIGKILL");
                  } catch (error) {
                    fail(error);
                  }
              };
              const finish = async () => {
                if (settled || !closed || !callbackDone || finalizing) return;
                finalizing = true;
                clearTimeout(workTimer);
                let summary;
                if (!failed)
                  try {
                    summary = JSON.parse(stdout);
                    assert(summary?.complete === true, "CENSUS_WORKER_REJECTED");
                  } catch (error) {
                    fail(error);
                  }
                const out = capture("stdout", stdout),
                  err = capture("stderr", stderr);
                if (timeoutPersistence) await timeoutPersistence;
                if (settled) return;
                pendingPersistences++;
                try {
                  cleanup();
                  await persist(
                    {
                      mode,
                      snapshot: "terminal",
                      closed: true,
                      exitSeen: exited,
                      failed,
                      stdoutObserved: out.observed,
                      stdoutTruncated: out.truncated,
                      stderrObserved: err.observed,
                      stderrTruncated: err.truncated,
                    },
                    out.bytes,
                    err.bytes,
                  );
                  cleanup();
                } catch (error) {
                  fail(error);
                } finally {
                  pendingPersistences--;
                }
                if (settled) return;
                settled = true;
                clearTimeout(cleanupTimer);
                if (failed) reject(first);
                else resolve(summary);
              };
              try {
                child = execute(
                  selected.python,
                  args,
                  {
                    env: { PATH: path.posix.dirname(selected.python) },
                    timeout,
                    killSignal: "SIGKILL",
                    maxBuffer: 1048576,
                    encoding: "buffer",
                    windowsHide: true,
                  },
                  (error, out, err) => {
                    stdout = out;
                    stderr = err;
                    callbackDone = true;
                    if (error !== null && error !== undefined) fail(error);
                    void finish();
                  },
                );
              } catch (error) {
                reject(error);
                return;
              }
              child.stdout?.on?.("data", (data) => collect("stdout", data));
              child.stderr?.on?.("data", (data) => collect("stderr", data));
              child.once("error", fail);
              child.once("exit", () => {
                exited = true;
              });
              child.once("close", () => {
                closed = true;
                void finish();
              });
              workTimer = setTimeout(
                () => {
                  fail(new Error("CENSUS_WORKER_DEADLINE"));
                  kill();
                  const out = capture("stdout", stdout),
                    err = capture("stderr", stderr);
                  pendingPersistences++;
                  timeoutPersistence = (async () => {
                    try {
                      cleanup();
                      await persist(
                        {
                          mode,
                          snapshot: "work-timeout",
                          closed,
                          exitSeen: exited,
                          failed: true,
                          stdoutObserved: out.observed,
                          stdoutTruncated: out.truncated,
                          stderrObserved: err.observed,
                          stderrTruncated: err.truncated,
                        },
                        out.bytes,
                        err.bytes,
                      );
                    } catch (error) {
                      fail(error);
                    } finally {
                      pendingPersistences--;
                    }
                  })();
                },
                Math.max(1, Math.floor(end - now())),
              );
              cleanupTimer = setTimeout(
                () => {
                  if (settled) return;
                  clearTimeout(workTimer);
                  finalizing = true;
                  fail(
                    new Error(
                      pendingPersistences > 0
                        ? "CENSUS_PERSISTENCE_UNCONFIRMED"
                        : "CENSUS_CHILD_UNCONFIRMED",
                    ),
                  );
                  settled = true;
                  try {
                    console.error(
                      JSON.stringify({
                        stage: "CENSUS_WORKER_UNCONFIRMED",
                        mode,
                        childClosed: closed,
                        callbackDone,
                        persistencePending: pendingPersistences > 0,
                        persistenceJoined: pendingPersistences === 0,
                        cleanupConfirmed: false,
                      }),
                    );
                  } catch {}
                  kill();
                  child.stdout?.destroy();
                  child.stderr?.destroy();
                  child.unref();
                  reject(first);
                },
                Math.max(1, Math.floor(cleanupEnd - now())),
              );
            });
