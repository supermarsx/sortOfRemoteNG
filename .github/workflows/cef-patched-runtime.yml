            for(let i=0;i<sections.length;i++)for(let j=0;j<i;j++){const a=sections[i],b=sections[j];if(a.bytes&&b.bytes)assert(a.raw+a.bytes<=b.raw||b.raw+b.bytes<=a.raw);}
