name: Patched CEF engineering runtime

# Deliberately no push, PR, pull_request_target, or schedule.
# Configure cef-runtime-publish with required reviewers and default-branch-only
# deployment rules before enabling publication. Dedicated tools are provisioned
# out of band; hosted preparation replays a fixed reviewed prerequisite recipe.
# Observations never fabricate or replace reviewed toolchain pins.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discover real standard-hosted prerequisites, or run the existing reviewed dedicated producer
        required: true
        default: build
        type: choice
        options: [build, discover, provision, hosted-build, acceptance]
      producers:
        description: Reviewed exact producer artifact identities for native acceptance only (JSON array)
        required: false
        default: ""
        type: string
      discovery_cleanup_linux:
        description: Explicitly remove only reviewed expendable Linux SDK directories during hosted preparation
        required: true
        default: false
        type: boolean
      reviewed_inputs:
        description: Reviewed checkout-relative directory containing source-lock.json and its pinned inputs
        required: true
        type: string
      target:
        description: Every selected target must already have reviewed GN/toolchain/runner-map pins
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
      publish:
        description: Request protected-environment approval to publish engineering prereleases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Supersede validation/build jobs individually. Workflow-wide cancellation would
# also interrupt an already running immutable publication critical section.

defaults:
  run:
    shell: bash

env:
  CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  accept-native:
    if: inputs.mode == 'acceptance' && github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public'
    permissions:
      # Ceiling only: the reusable plan and ordinary native jobs explicitly downscope.
      contents: write
      actions: read
    concurrency:
      group: cef-engine-accept-native-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}
      cancel-in-progress: true
    uses: ./.github/workflows/cef-runtime-acceptance.yml
    with:
      reviewed_inputs: ${{ inputs.reviewed_inputs }}
      producers: ${{ inputs.producers }}
  hosted-plan:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && (inputs.mode == 'discover' || inputs.mode == 'provision')
    concurrency:
      group: cef-engine-hosted-plan-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}-${{ inputs.target }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Select reviewed native targets before scheduling hosted runners
        id: plan
        env:
          CEF_TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import { hostedTargetMatrix } from './scripts/cef-hosted-bootstrap.mjs';
          const matrix = hostedTargetMatrix(process.env.CEF_TARGET);
          await appendFile(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE
  discover:
    needs: hosted-plan
    if: inputs.mode == 'discover' && github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public'
    concurrency:
      group: cef-engine-discover-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosted-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Observe actual tools without granting build or publication authority
        env:
          CEF_TARGET: ${{ matrix.target }}
          CEF_DISCOVERY_OUTPUT: ${{ runner.temp }}/cef-hosted-discovery
          CEF_DISCOVERY_CLEANUP: ${{ matrix.platform == 'linux' && inputs.discovery_cleanup_linux }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          cleanup=()
          if [[ "$CEF_DISCOVERY_CLEANUP" == 'true' ]]; then cleanup+=(--cleanup); fi
          node scripts/cef-hosted-bootstrap.mjs --target "$CEF_TARGET" --output "$CEF_DISCOVERY_OUTPUT" "${cleanup[@]}"
      - name: Retain unreviewed prerequisite observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-hosted-discovery-${{ matrix.target }}
          path: ${{ runner.temp }}/cef-hosted-discovery
          retention-days: 14
          if-no-files-found: error
  plan:
    if: github.event_name == 'workflow_dispatch' && ((inputs.mode == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (inputs.mode == 'hosted-build' && github.event.repository.visibility == 'public'))
    concurrency:
      group: cef-engine-plan-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}-${{ inputs.target }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Validate reviewed pins before scheduling engine runners
        id: plan
        env:
          CEF_INPUTS: ${{ inputs.reviewed_inputs }}
          CEF_TARGET: ${{ inputs.target }}
          CEF_RUNNER_MODE: ${{ inputs.mode == 'hosted-build' && 'hosted' || 'dedicated' }}
        run: node scripts/cef-runtime-ci.mjs plan --inputs "$CEF_INPUTS" --target "$CEF_TARGET" --runner-mode "$CEF_RUNNER_MODE"

  provision:
    needs: hosted-plan
    if: inputs.mode == 'provision' && github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public'
    concurrency:
      group: cef-engine-provision-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosted-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Provision fixed reviewed prerequisites on ephemeral public runners
        env:
          CEF_TARGET: ${{ matrix.target }}
          CEF_PROVISION_OUTPUT: ${{ runner.temp }}/cef-hosted-provision
          CEF_PROVISION_CLEANUP: ${{ matrix.platform == 'linux' && inputs.discovery_cleanup_linux }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          cleanup=()
          if [[ "$CEF_PROVISION_CLEANUP" == 'true' ]]; then cleanup+=(--cleanup); fi
          node scripts/cef-hosted-provision.mjs --target "$CEF_TARGET" --output "$CEF_PROVISION_OUTPUT" --execute "${cleanup[@]}"
      - name: Retain actual post-provision observations for separate pin review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-hosted-provision-${{ matrix.target }}
          path: ${{ runner.temp }}/cef-hosted-provision
          retention-days: 14
          if-no-files-found: error

  build:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && ((inputs.mode == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (inputs.mode == 'hosted-build' && github.event.repository.visibility == 'public'))
    concurrency:
      group: cef-engine-build-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.reviewed_inputs }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runners }}
    timeout-minutes: ${{ inputs.mode == 'hosted-build' && 350 || 4320 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Replay fixed prerequisites before checking reviewed hosted pins
        if: inputs.mode == 'hosted-build'
        env:
          CEF_TARGET: ${{ matrix.provisionTarget }}
          CEF_PROVISION_OUTPUT: ${{ runner.temp }}/cef-hosted-provision
          CEF_PROVISION_CLEANUP: ${{ runner.os == 'Linux' && inputs.discovery_cleanup_linux }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          cleanup=()
          if [[ "$CEF_PROVISION_CLEANUP" == 'true' ]]; then cleanup+=(--cleanup); fi
          node scripts/cef-hosted-provision.mjs --target "$CEF_TARGET" --output "$CEF_PROVISION_OUTPUT" --execute "${cleanup[@]}"
      # Dedicated runner service must supply SORNG_CEF_TOOLS_ROOT. Its reviewed inventory
      # includes cef-ci-runner-<target>.json and the selected Python executable.
      # RUNNER_TEMP must be short, space-free, outside checkout/node_modules,
      # and have sufficient engine-source/object/SDK disk capacity.
      - name: Acquire pinned source, sync bounded DEPS, build and verify SDK
        id: build
        env:
          CEF_INPUTS: ${{ inputs.reviewed_inputs }}
          CEF_TARGET: ${{ matrix.target }}
          CEF_RUNNER_MODE: ${{ inputs.mode == 'hosted-build' && 'hosted' || 'dedicated' }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [[ "$CEF_RUNNER_MODE" == 'hosted' ]]; then
            if [[ "$RUNNER_OS" == 'Windows' ]]; then export SORNG_CEF_TOOLS_ROOT='C:/'; else export SORNG_CEF_TOOLS_ROOT='/'; fi
          fi
          node scripts/cef-runtime-ci.mjs build --inputs "$CEF_INPUTS" --target "$CEF_TARGET" --repository "$GITHUB_REPOSITORY" --runner-mode "$CEF_RUNNER_MODE" --execute
      - name: Retain actual hosted prerequisites even when identity or source preparation fails
        if: always() && inputs.mode == 'hosted-build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-hosted-build-prerequisites-${{ matrix.key }}
          path: ${{ runner.temp }}/cef-hosted-provision
          retention-days: 14
          if-no-files-found: warn
      - name: Retain complete source/build/package diagnostics
        if: always() && steps.build.outputs.logs != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-engine-logs-${{ matrix.key }}
          path: ${{ steps.build.outputs.logs }}
          retention-days: 30
          if-no-files-found: error
      - name: Transfer verified SDK bundle to protected publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-engine-bundle-${{ matrix.key }}
          path: ${{ steps.build.outputs.bundle }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: inputs.mode == 'build' && inputs.publish == true && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: cef-runtime-publish
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A different dispatch selecting "all" vs a single target must not race the
    # same immutable release. Publication checks/compares bytes under this key.
    concurrency:
      group: cef-engine-publish-${{ matrix.key }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cef-engine-bundle-${{ matrix.key }}
          path: ${{ runner.temp }}/cef-engine-publish
      - name: Verify bytes and publish immutable engineering prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CEF_PUBLISH_APPROVED: "true"
          CEF_BUNDLE: ${{ runner.temp }}/cef-engine-publish
        run: node scripts/cef-runtime-ci.mjs publish --bundle "$CEF_BUNDLE" --repository "$GITHUB_REPOSITORY" --execute
