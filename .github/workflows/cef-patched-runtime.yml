          export function signatureObservation(result){const value=JSON.parse(result.stdout);assert.deepEqual(Object.keys(value).sort(),['schemaVersion','status','closeStatus','fileVersion','cacheOnly','subjectObserved'].sort());assert(value.schemaVersion===1&&value.cacheOnly===true&&value.subjectObserved===false);boundedInteger(value.status,0xffffffff);boundedInteger(value.closeStatus,0xffffffff);assert(value.fileVersion===null||typeof value.fileVersion==='string'&&value.fileVersion.length<=128&&!/[\x00-\x1f\x7f]/.test(value.fileVersion));return {...value,verified:value.status===0&&value.closeStatus===0,signerIdentity:'not-observed'};}
