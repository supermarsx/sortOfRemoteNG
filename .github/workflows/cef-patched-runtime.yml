              records.push({name,size:bytes.length,sha256:row.sha256});
            }
            return {records,gitCandidates:candidates};
          }
          export async function importObservations(rows,requested,state){
            const output=[],seen=new Set();
            for(const tool of requested){const source=rows.find(r=>r.path.toLowerCase()===path.resolve(tool).toLowerCase());
              for(const name of [...(source?.binary?.imports??[]),...(source?.binary?.delayImports??[])]){
