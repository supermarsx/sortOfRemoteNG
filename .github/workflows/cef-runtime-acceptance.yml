name: Native patched CEF acceptance

on:
  workflow_call:
    inputs:
      reviewed_inputs:
        description: Reviewed checkout-relative six-target source inputs
        required: true
        type: string
      producers:
        description: Reviewed exact producer/artifact/descriptor identity records
        required: true
        type: string
  workflow_dispatch:
    inputs:
      reviewed_inputs:
        description: Reviewed checkout-relative six-target source inputs
        required: true
        type: string
      producers:
        description: Reviewed JSON array of target/runId/headSha/artifactId/artifactSha256/descriptorSha256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cef-native-acceptance-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Validate exact successful producer runs and reviewed artifact identities
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_PRODUCERS: ${{ inputs.producers }}
          CEF_REVIEWED_INPUTS: ${{ inputs.reviewed_inputs }}
        run: node scripts/cef-runtime-acceptance-ci.mjs plan

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target != 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1-aarch64-pc-windows-msvc"
          targets: ${{ matrix.target }}
      - name: Install locked build assets
        run: npm ci
      - name: Install fixed Linux native build and isolated X11 prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config
          libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev
          libudev-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev xvfb xauth
      - name: Download only the exact validated producer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ matrix.artifactId }}
          run-id: ${{ matrix.runId }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cef-native-bundle
      - name: Build native clients and execute real TLS and H2 security gates sequentially
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
          CEF_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/cef-native-acceptance
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a --server-args='-screen 0 1280x1024x24 -nolisten tcp' node scripts/cef-runtime-acceptance-ci.mjs run
          else
            node scripts/cef-runtime-acceptance-ci.mjs run
          fi
      - name: Retain actual native reports, logs and cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-native-acceptance-${{ matrix.target }}-${{ matrix.headSha }}
          path: |
            ${{ runner.temp }}/cef-native-acceptance/*.json
            ${{ runner.temp }}/cef-native-acceptance/*.log
            ${{ runner.temp }}/cef-native-acceptance/tls/**
            ${{ runner.temp }}/cef-native-acceptance/http2-*/**
          retention-days: 30
          if-no-files-found: warn
