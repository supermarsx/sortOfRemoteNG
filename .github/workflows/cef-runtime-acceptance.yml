name: Native patched CEF acceptance

on:
  workflow_call:
    inputs:
      reviewed_inputs:
        description: Reviewed checkout-relative six-target source inputs
        required: true
        type: string
      producers:
        description: Reviewed exact producer/artifact/descriptor identity records
        required: true
        type: string
  workflow_dispatch:
    inputs:
      reviewed_inputs:
        description: Reviewed checkout-relative six-target source inputs
        required: true
        type: string
      producers:
        description: Exact legacy producer rows, or engineering-sdk rows with runAttempt and completionSha256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cef-native-acceptance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ordinary_matrix: ${{ steps.partition.outputs.ordinary_matrix }}
      draft_matrix: ${{ steps.partition.outputs.draft_matrix }}
      has_ordinary: ${{ steps.partition.outputs.has_ordinary }}
      has_draft: ${{ steps.partition.outputs.has_draft }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Validate exact successful producer runs and reviewed artifact identities
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_PRODUCERS: ${{ inputs.producers }}
          CEF_REVIEWED_INPUTS: ${{ inputs.reviewed_inputs }}
        run: node scripts/cef-runtime-acceptance-ci.mjs plan
      - name: Partition only validated producer rows by Draft credential requirement
        id: partition
        env:
          CEF_VALIDATED_MATRIX: ${{ steps.plan.outputs.matrix }}
          CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CEF_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const matrix = JSON.parse(process.env.CEF_VALIDATED_MATRIX);
          if (!matrix || Object.keys(matrix).join(',') !== 'include' ||
              !Array.isArray(matrix.include) || matrix.include.length < 1 || matrix.include.length > 6)
            throw new Error('Invalid validated native matrix');
          const ordinary = [], draft = [], targets = new Set();
          for (const row of matrix.include) {
            if (!row || typeof row !== 'object' || typeof row.target !== 'string' || targets.has(row.target))
              throw new Error('Invalid validated native row');
            targets.add(row.target);
            if (!Object.hasOwn(row, 'producer')) ordinary.push(row);
            else if (row.producer === 'owned-import' || row.producer === 'engineering-sdk') draft.push(row);
            else throw new Error('Unsupported native producer credential requirement');
          }
          if (draft.length && (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              process.env.CEF_REPOSITORY_VISIBILITY !== 'public' || !process.env.CEF_DEFAULT_BRANCH ||
              process.env.GITHUB_REF !== 'refs/heads/' + process.env.CEF_DEFAULT_BRANCH))
            throw new Error('Draft native acceptance requires public default-branch manual execution');
          // This is a write-capable job credential; the existing transport performs GET only.
          await appendFile(process.env.GITHUB_OUTPUT,
            'ordinary_matrix=' + JSON.stringify({include: ordinary}) + '\n' +
            'draft_matrix=' + JSON.stringify({include: draft}) + '\n' +
            'has_ordinary=' + String(ordinary.length > 0) + '\n' +
            'has_draft=' + String(draft.length > 0) + '\n');
          NODE

  native:
    needs: plan
    if: needs.plan.outputs.has_ordinary == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ordinary_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target != 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1-aarch64-pc-windows-msvc"
          targets: ${{ matrix.target }}
      - name: Install locked build assets
        run: npm ci
      - name: Install fixed Linux native build and isolated X11 prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config
          libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev
          libudev-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev xvfb xauth
      - name: Download only the exact validated legacy producer artifact
        if: matrix.producer != 'engineering-sdk' && matrix.producer != 'owned-import'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ matrix.artifactId }}
          run-id: ${{ matrix.runId }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cef-native-bundle
      - name: Download completed SDK through its independent seal before native execution
        if: matrix.producer == 'engineering-sdk'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
        run: node scripts/cef-runtime-acceptance-ci.mjs download-sdk
      - name: Download reviewed local SDK through its distinct owned-import seal
        if: matrix.producer == 'owned-import'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
        run: node scripts/cef-runtime-acceptance-ci.mjs download-owned
      - name: Build native clients and execute real TLS and H2 security gates sequentially
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
          CEF_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/cef-native-acceptance
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a --server-args='-screen 0 1280x1024x24 -nolisten tcp' node scripts/cef-runtime-acceptance-ci.mjs run
          else
            node scripts/cef-runtime-acceptance-ci.mjs run
          fi
      - name: Retain successful native acceptance seal
        if: success() && github.workflow_ref == format('{0}/.github/workflows/cef-runtime-acceptance.yml@{1}', github.repository, github.ref)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-native-acceptance-seal-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-native-acceptance/seal.json
          retention-days: 30
          if-no-files-found: error
      - name: Retain actual native reports, logs and cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-native-acceptance-${{ matrix.target }}-${{ matrix.headSha }}
          path: |
            ${{ runner.temp }}/cef-native-acceptance/*.json
            ${{ runner.temp }}/cef-native-acceptance/*.log
            ${{ runner.temp }}/cef-native-acceptance/tls/**
            ${{ runner.temp }}/cef-native-acceptance/http2-*/**
          retention-days: 30
          if-no-files-found: warn

  native-draft:
    # Only these two reviewed producer types need private Draft visibility.
    # The credential CAN write; download commands remain GET-only.
    needs: plan
    if: needs.plan.outputs.has_draft == 'true'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.draft_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target != 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          toolchain: "1.98.1-aarch64-pc-windows-msvc"
          targets: ${{ matrix.target }}
      - name: Install locked build assets
        run: npm ci
      - name: Install fixed Linux native build and isolated X11 prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config
          libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev
          libudev-dev libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev xvfb xauth
      - name: Download only the exact validated legacy producer artifact
        if: matrix.producer != 'engineering-sdk' && matrix.producer != 'owned-import'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ matrix.artifactId }}
          run-id: ${{ matrix.runId }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cef-native-bundle
      - name: Download completed SDK through its independent seal before native execution
        if: matrix.producer == 'engineering-sdk'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
        run: node scripts/cef-runtime-acceptance-ci.mjs download-sdk
      - name: Download reviewed local SDK through its distinct owned-import seal
        if: matrix.producer == 'owned-import'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
        run: node scripts/cef-runtime-acceptance-ci.mjs download-owned
      - name: Build native clients and execute real TLS and H2 security gates sequentially
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CEF_ENTRY: ${{ toJSON(matrix) }}
          CEF_BUNDLE: ${{ runner.temp }}/cef-native-bundle
          CEF_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/cef-native-acceptance
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a --server-args='-screen 0 1280x1024x24 -nolisten tcp' node scripts/cef-runtime-acceptance-ci.mjs run
          else
            node scripts/cef-runtime-acceptance-ci.mjs run
          fi
      - name: Retain successful native acceptance seal
        if: success() && github.workflow_ref == format('{0}/.github/workflows/cef-runtime-acceptance.yml@{1}', github.repository, github.ref)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-native-acceptance-seal-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-native-acceptance/seal.json
          retention-days: 30
          if-no-files-found: error
      - name: Retain actual native reports, logs and cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-native-acceptance-${{ matrix.target }}-${{ matrix.headSha }}
          path: |
            ${{ runner.temp }}/cef-native-acceptance/*.json
            ${{ runner.temp }}/cef-native-acceptance/*.log
            ${{ runner.temp }}/cef-native-acceptance/tls/**
            ${{ runner.temp }}/cef-native-acceptance/http2-*/**
          retention-days: 30
          if-no-files-found: warn
