name: Private Mac census deadline diagnostic
on:
  push:
    branches: [codex/diagnose-mac-census-deadline-20261113]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/diagnose-mac-census-deadline-20261113' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Retain the original whole-job clock
        run: printf 'MAC_CENSUS_DIAG_STARTED_MS=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Compare the exact native helper and original client with private failure witnesses
        run: node tests/fixtures/cef/mac_census_deadline_diagnostic.mjs
      - name: Retain only the bounded diagnostic report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: private-mac-census-deadline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-mac-census-deadline-diagnostic-*/report.json
          if-no-files-found: warn
          retention-days: 14
