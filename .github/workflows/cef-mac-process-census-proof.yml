name: CEF Mac census and Python link proofs
# Scratch ABI oracle and metadata witnesses only. No CEF, SDK or admission.
on:
  workflow_dispatch:
    inputs:
      proof:
        description: Fixed proof to execute; neither admits a production runtime
        type: choice
        options:
          - measurement
          - supervisor
        default: measurement
        required: true
permissions:
  contents: read
jobs:
  proof:
    if: inputs.proof == 'measurement' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Independently witness only the fixed Python installation link chain
        id: python-links
        timeout-minutes: 1
        run: node tests/fixtures/cef/mac_python_links_proof.mjs
      - name: Bind exact proof authority and pinned interpreter
        id: prepare
        if: always()
        timeout-minutes: 1
        run: node tests/fixtures/cef/mac_process_census_carrier.mjs prepare
      - name: Measure owned census identities and a tiny SDK ABI oracle
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 4
        env:
          CEF_CENSUS_OUTPUT: ${{ steps.prepare.outputs.output }}
        run: node tests/fixtures/cef/mac_process_census_proof.mjs --output "$CEF_CENSUS_OUTPUT"
      - name: Independently select the bounded census result
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          CEF_CENSUS_OUTPUT: ${{ steps.prepare.outputs.output }}
        run: node tests/fixtures/cef/mac_process_census_carrier.mjs validate
      - name: Retain independent reports and fixed bounded compiler diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-census-and-python-links-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cef-mac-census-proof-*/proof.json
            ${{ runner.temp }}/cef-mac-census-proof-*/checkpoint-compile.stdout.log
            ${{ runner.temp }}/cef-mac-census-proof-*/checkpoint-compile.stderr.log
            ${{ runner.temp }}/cef-mac-python-links-proof-*/proof.json
          if-no-files-found: warn
          retention-days: 14
  supervisor:
    if: inputs.proof == 'supervisor' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Bind exact integration proof authority and pinned interpreter
        id: prepare
        timeout-minutes: 1
        run: node tests/fixtures/cef/mac_process_census_carrier.mjs prepare-supervisor
      - name: Exercise the actual bounded supervisor with only owned tiny actors
        if: steps.prepare.outcome == 'success'
        timeout-minutes: 3
        env:
          CEF_CENSUS_OUTPUT: ${{ steps.prepare.outputs.output }}
        run: node tests/fixtures/cef/mac_census_supervisor_proof.mjs --output "$CEF_CENSUS_OUTPUT"
      - name: Independently select the completed supervisor proof
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          CEF_CENSUS_OUTPUT: ${{ steps.prepare.outputs.output }}
        run: node tests/fixtures/cef/mac_process_census_carrier.mjs validate-supervisor
      - name: Retain the bounded independent integration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-census-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-mac-census-supervisor-proof-*/proof.json
          if-no-files-found: warn
          retention-days: 14
