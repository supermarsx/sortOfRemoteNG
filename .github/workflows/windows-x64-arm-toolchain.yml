name: Windows x64 ARM Clang toolchain diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-arm-toolchain-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolchain:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          architecture: x64
          package-manager-cache: false
      - name: Validate the fixed toolchain source contract
        shell: bash
        run: node --test tests/tooling/windowsX64ArmToolchain.node-test.mjs
      - name: Owned SDK and Clang acquisition plus nonexecuting ARM64 slice
        timeout-minutes: 62
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {createHash, randomUUID} from 'node:crypto';
          import {execFile, spawn} from 'node:child_process';
          import {promisify} from 'node:util';
          const execute=promisify(execFile), hash=b=>createHash('sha256').update(b).digest('hex');
          const begin=Date.now(), beginMono=performance.now(), workMs=3600000;
          const remaining=()=>Math.min(begin+workMs-Date.now(), workMs-(performance.now()-beginMono));
          let child, root, originalFailure, outcome=null, phase='authority';
          async function physical(p){
            assert(path.isAbsolute(p)&&!p.replaceAll('\\','/').split('/').some(x=>x==='.'||x==='..'));
            const actual=await fs.realpath(p);
            assert.equal(actual.replaceAll('\\','/').toLowerCase(),p.replaceAll('\\','/').toLowerCase());
            for(let x=p;;x=path.dirname(x)){const s=await fs.lstat(x);assert(!s.isSymbolicLink());if(path.dirname(x)===x)break;}
            return actual;
          }
          async function held(p,cap=2097152){
            await physical(p);const a=await fs.lstat(p,{bigint:true});assert(a.isFile()&&a.nlink===1n&&a.size<=BigInt(cap));
            const f=await fs.open(p,'r');try{const b=await f.stat({bigint:true});assert.equal(a.dev,b.dev);assert.equal(a.ino,b.ino);assert.equal(a.size,b.size);
              const chunks=[],buffer=Buffer.alloc(65536);let total=0;
              while(true){const {bytesRead}=await f.read(buffer,0,Math.min(buffer.length,cap+1-total),null);if(!bytesRead)break;total+=bytesRead;assert(total<=cap);chunks.push(Buffer.from(buffer.subarray(0,bytesRead)));}
              const raw=Buffer.concat(chunks,total);const c=await f.stat({bigint:true}),d=await fs.lstat(p,{bigint:true});
              for(const k of ['dev','ino','size','mtimeNs','ctimeNs','birthtimeNs','mode','nlink']){assert.equal(a[k],d[k]);assert.equal(b[k],c[k]);}
              for(const k of ['dev','ino','size','mtimeNs','birthtimeNs','nlink'])assert.equal(a[k],b[k]);return raw;
            }finally{await f.close();}
          }
          try{
            assert.equal(process.env.GITHUB_EVENT_NAME,'workflow_dispatch');assert.equal(process.env.GITHUB_REPOSITORY,'supermarsx/sortOfRemoteNG');
            assert.equal(process.env.GITHUB_REPOSITORY_ID,'1010282954');assert.equal(process.env.GITHUB_REPOSITORY_VISIBILITY,'public');
            assert.equal(process.env.GITHUB_REF,'refs/heads/'+process.env.CEF_DEFAULT_BRANCH);assert.equal(process.env.GITHUB_WORKFLOW_SHA,process.env.GITHUB_SHA);
            const repo=await physical(process.cwd()),dir=path.join(repo,'native/windows-x64-arm-toolchain');
            phase='profile';const rawProfile=await held(path.join(dir,'profile.json')),p=JSON.parse(rawProfile);
            assert.equal(p.kind,'sorng-x64-arm-toolchain-diagnostic');assert.equal(p.buildAdmission,false);assert.equal(process.env.ImageVersion,p.image);
            phase='python';const py=await held(p.python.path,262144);assert.equal(py.length,p.python.bytes);assert.equal(hash(py),p.python.sha256);
            const parent=path.join(repo,'.artifacts');await fs.mkdir(parent,{recursive:true});await physical(parent);
            root=path.join(parent,'windows-x64-arm-toolchain-'+randomUUID());await fs.mkdir(root);
            for(const name of ['tmp','home','jobs','logs','results','objects','sources','bin','maps','source-inputs'])await fs.mkdir(path.join(root,name));
            phase='source-snapshot';const sources=[];
            for(const [i,file]of p.sourcePaths.entries()){
              assert(!file.split('/').some(x=>x==='.'||x==='..'));
              const canonical=(await execute('git',['cat-file','blob',process.env.GITHUB_SHA+':'+file],{encoding:'buffer',windowsHide:true,timeout:10000,maxBuffer:2097152})).stdout;
              const live=await held(path.join(repo,file));let encoding='exact';
              if(!live.equals(canonical)){
                assert(file==='.github/workflows/windows-x64-arm-toolchain.yml'||file==='tests/tooling/windowsX64ArmToolchain.node-test.mjs');
                const text=new TextDecoder('utf-8',{fatal:true}).decode(canonical);assert(!text.includes('\r'));assert(live.equals(Buffer.from(text.replaceAll('\n','\r\n'))));encoding='git-crlf';
              }
              await fs.writeFile(path.join(root,'source-inputs',String(i)),live,{flag:'wx'});
              sources.push({path:file,bytes:live.length,sha256:hash(live),canonicalBytes:canonical.length,canonicalSha256:hash(canonical),encoding});
            }
            // Same Python clock epoch as later workers, sampled once before context sealing.
            const env={SystemRoot:'C:/Windows',WINDIR:'C:/Windows',Path:path.dirname(p.python.path)+';C:/Windows/System32',TEMP:path.join(root,'tmp'),TMP:path.join(root,'tmp'),USERPROFILE:path.join(root,'home'),PYTHONDONTWRITEBYTECODE:'1'};
            const monoRaw=(await execute(p.python.path,['-I','-B','-c','import time;print(time.monotonic())'],{env,windowsHide:true,timeout:10000,maxBuffer:1024})).stdout.trim();
            assert(/^\d+(\.\d+)?$/.test(monoRaw)&&remaining()>0);const mono=Number(monoRaw);assert(Number.isFinite(mono)&&mono>0&&mono<1e12);
            const context={kind:'sorng-x64-arm-toolchain-context',repository:process.env.GITHUB_REPOSITORY,repositoryId:process.env.GITHUB_REPOSITORY_ID,visibility:process.env.GITHUB_REPOSITORY_VISIBILITY,event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,defaultBranch:process.env.CEF_DEFAULT_BRANCH,head:process.env.GITHUB_SHA,workflowSha:process.env.GITHUB_WORKFLOW_SHA,workflow:'.github/workflows/windows-x64-arm-toolchain.yml',runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,image:process.env.ImageVersion,beginUtc:new Date(begin).toISOString(),wallWorkEnd:(Date.now()+remaining())/1000,monotonicWorkEnd:mono+remaining()/1000,sources};
            const contextRaw=Buffer.from(JSON.stringify(context,null,2)+'\n');await fs.writeFile(path.join(root,'context.json'),contextRaw,{flag:'wx'});
            assert(remaining()>3000);
            const args=['-I','-B',path.join(dir,'slice.py'),'--supervise',root,hash(contextRaw),'--execute'];
            const buffers=[],errors=[];let count=0,stopFailure=false;
            const stop=()=>{try{child?.kill();}catch{stopFailure=true;}};
            phase='owned-operation';child=spawn(p.python.path,args,{cwd:root,env,windowsHide:true,stdio:['ignore','pipe','pipe']});
            for(const [stream,list]of [[child.stdout,buffers],[child.stderr,errors]])stream.on('data',b=>{count+=b.length;if(count>131072){originalFailure??='TOOLCHAIN_PARENT_OUTPUT_BOUND';stop();}else list.push(b);});
            const timer=setTimeout(()=>{originalFailure??='TOOLCHAIN_PARENT_DEADLINE';stop();},Math.max(1,remaining()));
            const hard=setTimeout(()=>{originalFailure??='TOOLCHAIN_PARENT_CLEANUP_UNCONFIRMED';stop();child.stdout.destroy();child.stderr.destroy();},Math.max(1,remaining()+30000));
            try{outcome=await new Promise((resolve,reject)=>{child.once('error',reject);child.once('close',(code,signal)=>resolve({code,signal}));});}finally{clearTimeout(timer);clearTimeout(hard);}
            await fs.writeFile(path.join(root,'supervisor-stdout.log'),Buffer.concat(buffers),{flag:'wx'});
            await fs.writeFile(path.join(root,'supervisor-stderr.log'),Buffer.concat(errors),{flag:'wx'});
            assert(!stopFailure&&remaining()>0&&outcome.code===0&&!originalFailure);
            const actual=JSON.parse(await held(path.join(root,'slice-result.json'),131072));
            assert(actual.success===true&&actual.stages.length===13&&actual.outputExecuted===false);
            for(const item of actual.stages)assert(item.job.success===true&&item.job.rootExit===0&&item.job.cleanupVerified===true&&item.job.activeAtEnd===0&&item.job.rootReaped===true&&item.job.logReadersStopped===true);
          }catch(error){originalFailure??=error?.code==='ENOENT'?'TOOLCHAIN_PARENT_MISSING':'TOOLCHAIN_PARENT_DENIED';}
          finally{
            const observedImage=/^\d{8}\.\d{1,8}\.\d{1,8}$/.test(process.env.ImageVersion??'')?process.env.ImageVersion:null;
            const summary={kind:'windows-x64-arm-toolchain-diagnostic',success:!originalFailure,failure:originalFailure??null,phase,observedImage,supervisorOutcome:outcome,observedAtUtc:new Date().toISOString(),remainingWorkMs:Math.max(0,remaining()),compilerOutcomeNotInferredFromSupervisor:true,outputExecuted:false,cefStarted:false,sdkBuilt:false,nativeAcceptance:false,publicationAllowed:false};
            const target=root??path.join(process.cwd(),'toolchain-preflight-denied.json');
            if(root)await fs.writeFile(path.join(root,'summary.json'),JSON.stringify(summary,null,2)+'\n',{flag:'wx'});else await fs.writeFile(target,JSON.stringify(summary,null,2)+'\n',{flag:'wx'});
            console.log(JSON.stringify(summary));if(originalFailure)process.exitCode=1;
          }
          NODE
      - name: Retain bounded toolchain receipts without SDK or LLVM payloads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-arm-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            toolchain-preflight-denied.json
            .artifacts/windows-x64-arm-toolchain-*/summary.json
            .artifacts/windows-x64-arm-toolchain-*/context.json
            .artifacts/windows-x64-arm-toolchain-*/slice-result.json
            .artifacts/windows-x64-arm-toolchain-*/acquisition.json
            .artifacts/windows-x64-arm-toolchain-*/acquisition-parent.json
            .artifacts/windows-x64-arm-toolchain-*/*-job.json
            .artifacts/windows-x64-arm-toolchain-*/operation-failure.json
            .artifacts/windows-x64-arm-toolchain-*/installed-observations.json
            .artifacts/windows-x64-arm-toolchain-*/jobs/*/*.json
            .artifacts/windows-x64-arm-toolchain-*/results/*.json
            .artifacts/windows-x64-arm-toolchain-*/logs/*.log
            .artifacts/windows-x64-arm-toolchain-*/supervisor-*.log
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
