name: Backend Coverage PowerShell diagnostic (private branch only)

on:
  push:
    branches: ["codex/diagnose-pwsh-coverage-20261113"]

permissions:
  contents: read

concurrency:
  group: pwsh-coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event_name == 'push' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.ref == 'refs/heads/codex/diagnose-pwsh-coverage-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Retain the existing immutable Node inventory; this does not invoke pwsh.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          save-if: false
          cache-on-failure: false
      - uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - name: Cold unchanged instrumented crate, then bounded comparisons
        run: python3 tests/fixtures/ssh-scripts/powershell_diagnostic.py
      - name: Retain bounded diagnostic evidence (never release coverage)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pwsh-coverage-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pwsh-coverage-diagnostic
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
          include-hidden-files: false
