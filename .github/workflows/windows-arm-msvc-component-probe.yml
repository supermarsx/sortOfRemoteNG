name: Windows ARM MSVC component probe (temporary diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'supermarsx/sortOfRemoteNG' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: List toolsets and available VC components
        shell: pwsh
        run: |
          Write-Output "ImageVersion=$env:ImageVersion"
          $vs = 'C:/Program Files/Microsoft Visual Studio/18/Enterprise'
          Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | ForEach-Object {
            $arm = Test-Path "$($_.FullName)/bin/Hostx64/arm64/cl.exe"
            $lib = Test-Path "$($_.FullName)/lib/arm64/libcmt.lib"
            Write-Output ("toolset " + $_.Name + " hostx64-arm64-cl=" + $arm + " lib-arm64=" + $lib)
          }
          $vsw = & 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe' -all -products * -include packages -format json | ConvertFrom-Json
          $ids = $vsw.packages | Where-Object { $_.id -like 'Microsoft.VisualStudio.Component.VC.*' } | ForEach-Object { $_.id + ' ' + $_.version } | Sort-Object -Unique
          Write-Output "installed VC component packages: $($ids.Count)"
          $ids | ForEach-Object { Write-Output $_ }
          Write-Output "--- cached channel manifests"
          $root = 'C:/ProgramData/Microsoft/VisualStudio/Packages/_Channels'
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100000 } | Select-Object -First 20 | ForEach-Object { Write-Output ($_.FullName + ' ' + $_.Length) }
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $hits = Select-String -Path $_.FullName -Pattern 'Microsoft\.VisualStudio\.Component\.VC\.14\.[0-9]+\.[0-9.]+\.[A-Za-z0-9.]+' -AllMatches -ErrorAction SilentlyContinue
              foreach ($h in $hits) { foreach ($m in $h.Matches) { $m.Value } }
            } | Sort-Object -Unique | ForEach-Object { Write-Output ("catalog " + $_) }
          } else { Write-Output "no channel cache at $root" }
