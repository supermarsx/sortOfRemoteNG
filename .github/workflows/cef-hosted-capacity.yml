name: CEF hosted runner capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acl-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.1-x86_64-pc-windows-msvc"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: browser-transport-contracts
      - name: Observe filesystem types
        shell: pwsh
        run: |
          Get-Volume | Select-Object DriveLetter, FileSystem
          Get-Item -LiteralPath $env:TEMP | Select-Object FullName, Attributes
      - name: Observe each ACL mutation stage
        run: node scripts/native-build-env.mjs cargo test --manifest-path src-tauri/Cargo.toml -p sorng-browser-host --features cef-host --lib runtime_access_repairs_directory_with_traverse_pin_without_propagating --locked -- --nocapture
