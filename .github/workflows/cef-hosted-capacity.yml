name: CEF hosted runner capacity

on:
  workflow_dispatch:
  push:
    branches: [codex/browser-release-20261009]
    paths:
      - .github/workflows/cef-hosted-capacity.yml
      - scripts/cef-hosted-capacity.mjs

permissions:
  contents: read

jobs:
  capacity:
    name: Capacity (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Standard public-repository runners only; no larger/paid runners.
        runner:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            windows-2025,
            windows-11-arm,
            macos-15-intel,
            macos-15,
          ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Measure available resources without changing the runner
        run: node scripts/cef-hosted-capacity.mjs
