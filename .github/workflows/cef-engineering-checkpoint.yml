name: Synthetic macOS supervisor diagnostic
# Diagnostic branch only. No CEF acquisition, SDK, checkpoint or release authority.
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Explicit synthetic process experiment only
        type: choice
        options: [synthetic-process-only]
        default: synthetic-process-only
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  supervisor-probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/codex/ci-macos-supervisor-probe-20261025' && inputs.diagnostic == 'synthetic-process-only'
    runs-on: macos-15-intel
    timeout-minutes: 8
    concurrency:
      group: synthetic-macos-supervisor-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run one bounded synthetic supervisor experiment
        id: probe
        env:
          PROBE_DIAGNOSTIC: ${{ inputs.diagnostic }}
          PROBE_VISIBILITY: ${{ github.event.repository.visibility }}
          PROBE_EXPECTED_SCRIPT_SHA: b08b8cca9a58b45078a2da069e193a4d83c704fbc6e9139d4b445aeb091d30d1
          PROBE_EXPECTED_HELPER_SHA: 4a5ad24beba2391a93c2c64c939fcb269b39cd89ab78ad728db6dcc57aa2851a
        run: node tests/tooling/fixtures/cefCompileSupervisorProbe.mjs
      - name: Retain only bounded synthetic diagnostic files
        if: always() && steps.probe.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-macos-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.probe.outputs.artifact_root }}/probe-plan.json
            ${{ steps.probe.outputs.artifact_root }}/probe-result.json
            ${{ steps.probe.outputs.artifact_root }}/compile-supervision.log
            ${{ steps.probe.outputs.artifact_root }}/checkpoint-compile.stdout.log
            ${{ steps.probe.outputs.artifact_root }}/checkpoint-compile.stderr.log
            ${{ steps.probe.outputs.artifact_root }}/checkpoint-compile.outcome.json
