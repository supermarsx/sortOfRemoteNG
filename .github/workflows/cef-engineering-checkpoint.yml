name: CEF private Mac source hash benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mac-source-hash-benchmark-20261103' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Start the original bounded benchmark clock
        run: echo "CEF_MAC_HASH_BENCHMARK_STARTED_MS=$(($(date +%s) * 1000))" >> "$GITHUB_ENV"
      - name: Require the exact reviewed host before checkout
        run: test "$ImageOS" = macos15 && test "$ImageVersion" = 20260824.0482.1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Benchmark only the bounded creation-owned file fixture
        timeout-minutes: 13
        run: |
          PYTHON=/usr/local/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          test "$(shasum -a 256 "$PYTHON" | cut -d ' ' -f 1)" = b08b055365df6dcd3fff0b805b688428f0f6a01839303f22c0716780155c480d
          "$PYTHON" -I -B -S tests/fixtures/cef/mac_source_hash_benchmark.py
      - name: Retain only the bounded nonauthorizing benchmark report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-mac-source-hash-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-mac-hash-benchmark-report.json
          if-no-files-found: error
          retention-days: 14
