name: CEF private Mac full-hash boundary capture proof
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mac-source-io-coalescing-proof-20261104' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Capture the original proof clock before checkout
        run: printf 'CEF_MAC_IO_PROOF_STARTED_MS=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Require the reviewed native image
        run: test "$ImageOS" = macos15 && test "$ImageVersion" = 20260824.0482.1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute only the held benign hash primitive fixtures
        timeout-minutes: 19
        run: |
          PYTHON=/usr/local/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          test "$(shasum -a 256 "$PYTHON" | cut -d ' ' -f 1)" = b08b055365df6dcd3fff0b805b688428f0f6a01839303f22c0716780155c480d
          env -i PATH=/usr/bin:/bin HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REPOSITORY_VISIBILITY="$GITHUB_REPOSITORY_VISIBILITY" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_TEMP="$RUNNER_TEMP" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            CEF_MAC_IO_PROOF_STARTED_MS="$CEF_MAC_IO_PROOF_STARTED_MS" \
            "$PYTHON" -I -B -S tests/fixtures/cef/mac_source_io_coalescing_proof.py
      - name: Retain only the bounded nonauthorizing report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-mac-source-io-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-mac-source-io-proof-report.json
          if-no-files-found: error
          retention-days: 14
