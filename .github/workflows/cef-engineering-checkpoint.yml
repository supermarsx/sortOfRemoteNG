name: CEF private Mac delayed reap lease diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mac-delayed-reap-lease-probe-20261104' && github.repository == 'supermarsx/sortOfRemoteNG' && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 8
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Start the original bounded diagnostic clock
        run: echo "CEF_MAC_DELAYED_REAP_STARTED_MS=$(($(date +%s) * 1000))" >> "$GITHUB_ENV"
      - name: Require the exact reviewed host before checkout
        run: test "$ImageOS" = macos15 && test "$ImageVersion" = 20260824.0482.1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Compare exact reaper cadence using fixed creation-owned processes
        timeout-minutes: 5
        run: |
          PYTHON=/usr/local/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          test "$(shasum -a 256 "$PYTHON" | cut -d ' ' -f 1)" = b08b055365df6dcd3fff0b805b688428f0f6a01839303f22c0716780155c480d
          node tests/fixtures/cef/mac_delayed_reap_lease_probe.mjs
      - name: Retain only the bounded nonauthorizing diagnostic report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cef-mac-delayed-reap-lease-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-mac-delayed-reap-report.json
          if-no-files-found: error
          retention-days: 14
