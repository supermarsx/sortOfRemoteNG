name: CEF owned Darwin source metadata proof
# Fresh temporary objects only. Policy support is reported separately from this
# diagnostic's production writes. Results grant no compiler, CEF or release authority.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cef-mac-owned-source-proof-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_id == '1010282954' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      CEF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Start the original whole-job proof clock
        run: echo "CEF_MAC_PACKAGE_JOB_STARTED_MS=$(($(date +%s) * 1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Prove only owned Darwin metadata on the reviewed Intel cross-build host
        id: proof
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import * as fs from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { createHash, randomUUID } from 'node:crypto';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import path from 'node:path';
          export const PYTHON = '/usr/local/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/bin/python3.14';
          export const PYTHON_SHA = 'b08b055365df6dcd3fff0b805b688428f0f6a01839303f22c0716780155c480d';
          export const PYTHON_BYTES = 13592;
          export function authority(env, platform, architecture) {
            assert(platform === 'darwin' && architecture === 'x64', 'OWNED_PROOF_HOST');
            assert(env.GITHUB_ACTIONS === 'true' && env.RUNNER_ENVIRONMENT === 'github-hosted', 'OWNED_PROOF_RUNNER');
            assert(env.GITHUB_EVENT_NAME === 'workflow_dispatch' && env.CEF_DEFAULT_BRANCH === 'main' && env.GITHUB_REF === 'refs/heads/main', 'OWNED_PROOF_EVENT');
            assert(env.GITHUB_REPOSITORY === 'supermarsx/sortOfRemoteNG' && env.GITHUB_REPOSITORY_ID === '1010282954' && env.GITHUB_REPOSITORY_VISIBILITY === 'public', 'OWNED_PROOF_REPOSITORY');
            assert(/^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? '') && env.GITHUB_WORKFLOW_SHA === env.GITHUB_SHA && env.GITHUB_WORKFLOW_REF === 'supermarsx/sortOfRemoteNG/.github/workflows/cef-mac-owned-source-proof.yml@refs/heads/main', 'OWNED_PROOF_SOURCE');
            assert(env.ImageOS === 'macos15' && env.ImageVersion === '20260824.0482.1', 'OWNED_PROOF_IMAGE');
          }
          const stamp = info => [info.dev, info.ino, info.mode, info.nlink, info.size, info.mtimeNs, info.ctimeNs, info.uid, info.gid].map(String).join(':');
          export async function heldBytes(file, maximum, io = fs) {
            const before = await io.lstat(file, { bigint: true });
            assert(before.isFile() && !before.isSymbolicLink() && before.size > 0n && before.size <= BigInt(maximum), 'OWNED_PROOF_FILE');
            assert(await io.realpath(file) === file, 'OWNED_PROOF_ALIAS');
            const handle = await io.open(file, constants.O_RDONLY | constants.O_NOFOLLOW);
            let failed = false;
            try {
              assert(stamp(await handle.stat({ bigint: true })) === stamp(before), 'OWNED_PROOF_IDENTITY');
              const buffer = Buffer.alloc(maximum + 1);
              let position = 0;
              while (position < buffer.length) {
                const { bytesRead } = await handle.read(buffer, position, buffer.length - position, position);
                if (!bytesRead) break;
                position += bytesRead;
              }
              assert(position === Number(before.size) && position <= maximum, 'OWNED_PROOF_BYTES');
              assert(stamp(await handle.stat({ bigint: true })) === stamp(before) && stamp(await io.lstat(file, { bigint: true })) === stamp(before), 'OWNED_PROOF_CHANGED');
              return buffer.subarray(0, position);
            } catch (error) { failed = true; throw error; }
            finally { try { await handle.close(); } catch (error) { if (!failed) throw error; } }
          }
          export async function verifyPython(io = fs) {
            const raw = await heldBytes(PYTHON, PYTHON_BYTES, io);
            assert(raw.length === PYTHON_BYTES && createHash('sha256').update(raw).digest('hex') === PYTHON_SHA, 'OWNED_PROOF_PYTHON_PIN');
          }
          export function childEnvironment(env) {
            return { PATH: '/usr/bin:/bin', RUNNER_TEMP: env.RUNNER_TEMP, GITHUB_WORKSPACE: env.GITHUB_WORKSPACE,
              ImageOS: env.ImageOS, ImageVersion: env.ImageVersion, GITHUB_ACTIONS: 'true',
              RUNNER_ENVIRONMENT: 'github-hosted', GITHUB_REPOSITORY_VISIBILITY: 'public' };
          }
          export function childFailure(error) {
            const allowedStages = new Set(['arguments', 'host', 'image', 'runner', 'python-executable', 'python-pin', 'temp', 'output', 'helper-import', 'admission', 'owned-root', 'capability', 'public-gates', 'roundtrip', 'cleanup', 'report']);
            const text = typeof error?.stdout === 'string' ? error.stdout.trim() : '';
            const denied = /^OWNED_SOURCE_PROOF_DENIED(?::([a-z-]{1,48}))?$/.exec(text);
            let preflight;
            if (Buffer.byteLength(text) <= 2048) {
              try {
                const value = JSON.parse(text);
                const keys = Object.keys(value).sort().join(',');
                const interpreter = value.interpreter;
                const exactKeys = interpreter === undefined ? 'complete,failure,kind,sourceWriteAdmitted,stage' : 'complete,failure,interpreter,kind,sourceWriteAdmitted,stage';
                const validInterpreter = interpreter === undefined || (
                  Object.keys(interpreter).sort().join(',') === 'basename,canonicalMatch,lexicalMatch,role' &&
                  ['reviewed-launcher', 'framework-app', 'other'].includes(interpreter.role) &&
                  ['python3.14', 'Python', 'python3', 'python', 'python.exe', 'other'].includes(interpreter.basename) &&
                  typeof interpreter.lexicalMatch === 'boolean' && (interpreter.canonicalMatch === null || typeof interpreter.canonicalMatch === 'boolean')
                );
                if (keys === exactKeys && value.kind === 'sorng-macarm-owned-source-preflight' && value.complete === false && value.failure === 'OWNED_SOURCE_PROOF_DENIED' && value.sourceWriteAdmitted === false && allowedStages.has(value.stage) && validInterpreter)
                  preflight = { stage: value.stage, ...(interpreter ? { interpreter: { role: interpreter.role, basename: interpreter.basename, lexicalMatch: interpreter.lexicalMatch, canonicalMatch: interpreter.canonicalMatch } } : {}) };
              } catch { /* Unknown output is never retained or echoed. */ }
            }
            const signals = new Set(['SIGKILL', 'SIGTERM', 'SIGABRT', 'SIGSEGV', 'SIGBUS']);
            return { kind: 'sorng-owned-darwin-proof-carrier', complete: false, phase: 'python-child',
              exit: Number.isSafeInteger(error?.code) && error.code >= 0 && error.code <= 2147483647 ? error.code : null,
              signal: signals.has(error?.signal) ? error.signal : null,
              preflightStage: preflight?.stage ?? (denied && allowedStages.has(denied[1]) ? denied[1] : 'unavailable'),
              denied: Boolean(preflight || denied),
              ...(preflight?.interpreter ? { interpreter: preflight.interpreter } : {}),
              stdoutBytes: Math.min(65536, typeof error?.stdout === 'string' ? Buffer.byteLength(error.stdout) : 0),
              stderrBytes: Math.min(65536, typeof error?.stderr === 'string' ? Buffer.byteLength(error.stderr) : 0),
              sourceWriteAdmitted: false, nativeAcceptance: false, runtimeReady: false };
          }
          export async function retainChildFailure(output, record, io = fs, uid = process.getuid()) {
            assert(/^cef-mac-owned-proof-[a-f0-9-]{36}$/.test(path.basename(output)), 'OWNED_PROOF_OUTPUT');
            try { await io.mkdir(output, { mode: 0o700 }); } catch (error) { if (error.code !== 'EEXIST') throw error; }
            const before = await io.lstat(output, { bigint: true });
            assert(before.isDirectory() && !before.isSymbolicLink() && before.uid === BigInt(uid) && (before.mode & 0o777n) === 0o700n && await io.realpath(output) === output, 'OWNED_PROOF_OUTPUT');
            await io.writeFile(path.join(output, 'carrier.json'), JSON.stringify(record) + '\n', { flag: 'wx', mode: 0o600 });
            const after = await io.lstat(output, { bigint: true });
            assert([before.dev, before.ino, before.mode, before.uid, before.gid].map(String).join(':') === [after.dev, after.ino, after.mode, after.uid, after.gid].map(String).join(':'), 'OWNED_PROOF_OUTPUT_CHANGED');
          }
          export function validateReport(report) {
            assert(report.complete === true && report.sourceWriteAdmitted === false && report.nativeAcceptance === false && report.runtimeReady === false, 'OWNED_PROOF_RESULT');
            assert(report.hostPlatform === 'darwin' && report.hostArchitecture === 'x86_64' && report.targetArchitecture === 'arm64', 'OWNED_PROOF_RESULT_HOST');
            assert(report.image === '20260824.0482.1' && report.sourceLockReference === '65ec154279f1ed2e697da5c1823e7cf0af7c30cebc33b027206c5219329aae54' && report.cleanupConfirmed === true && report.scopedSourceWritesSupported === true && report.scopedSourcePolicy === 'sorng-macarm-owned-source-metadata-intel-20260824-v1' && report.productionInputWrites === false && report.publicOutOfScopeDeniedBefore === true && report.publicOutOfScopeDeniedAfter === true, 'OWNED_PROOF_QUALIFICATION');
            const cap = report.capability;
            assert(cap?.complete === true && cap.cleanupConfirmed === true && cap.objectsRemoved === true && cap.handlesClosed === true && Array.isArray(cap.rows) && cap.rows.length === 12, 'OWNED_PROOF_CAPABILITY');
            const cases = new Set();
            for (const row of cap.rows) {
              assert(['file', 'directory', 'root', 'symlink'].includes(row.role) && ['no-op', 'past', 'future'].includes(row.case) && row.exactMtimeReadback === true && row.symlinkTargetUnchanged === true, 'OWNED_PROOF_TIMESTAMP');
              const birth = row.birthTransition;
              const token = value => Array.isArray(value) && value.length === 2 && ['birthtime-ns', 'darwin-birthtime-float-hex'].includes(value[0]) && typeof value[1] === 'string' && value[1].length > 0 && value[1].length <= 64;
              assert(birth?.kind === 'owned-utime-birth-observation' && token(birth.before) && token(birth.after) && birth.changed === (JSON.stringify(birth.before) !== JSON.stringify(birth.after)), 'OWNED_PROOF_BIRTH_OBSERVATION');
              cases.add(row.role + ':' + row.case);
            }
            assert(cases.size === 12, 'OWNED_PROOF_CASES');
            const roundtrip = report.roundtrip;
            assert(roundtrip?.sidecarKind === 'sorng-macarm-source-metadata' && ['complete', 'recorded', 'driftDetected', 'applied', 'verified', 'sidecarUnchanged', 'noLinuxStatCache', 'cleanupConfirmed'].every(key => roundtrip[key] === true), 'OWNED_PROOF_ROUNDTRIP');
          }
          export async function runOwnedSourceProof() {
            authority(process.env, process.platform, process.arch);
            await verifyPython();
            const temp = await fs.realpath(process.env.RUNNER_TEMP);
            const info = await fs.lstat(temp);
            assert(temp === process.env.RUNNER_TEMP && temp !== '/' && info.isDirectory() && !info.isSymbolicLink() && info.uid === process.getuid(), 'OWNED_PROOF_TEMP');
            const output = path.join(temp, 'cef-mac-owned-proof-' + randomUUID());
            await assert.rejects(fs.lstat(output), { code: 'ENOENT' });
            await fs.appendFile(process.env.GITHUB_OUTPUT, 'root=' + output + '\n');
            // Fixed scratch-only fixture; no tokens, inherited Python flags,
            // Xcode/Metal queries, installed-input mutation or native build.
            try {
              await promisify(execFile)(PYTHON, ['-I', '-B', 'tests/fixtures/cef/mac_owned_source_proof.py', '--output', output], {
                cwd: process.env.GITHUB_WORKSPACE, env: childEnvironment(process.env),
                timeout: 120000, maxBuffer: 65536, killSignal: 'SIGKILL', windowsHide: true
              });
            } catch (error) {
              const record = childFailure(error);
              console.error(JSON.stringify(record));
              try { await retainChildFailure(output, record); } catch { /* Keep the original child failure. */ }
              throw error;
            }
            const report = JSON.parse((await heldBytes(path.join(output, 'proof.json'), 128 * 1024)).toString('utf8'));
            validateReport(report);
            console.log('Owned Darwin metadata proof complete; scoped policy support and zero production input writes verified separately.');
          }
          try { await runOwnedSourceProof(); } catch { console.error('OWNED_DARWIN_PROOF_FAILED'); process.exitCode = 1; }
          NODE
      - name: Prove the exact Python package candidate closure without production admission
        id: package
        if: always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success'
        timeout-minutes: 2
        run: node tests/fixtures/cef/mac_python_package_proof.mjs
      - name: Prove Intel source metadata only on fresh owned objects
        id: intel
        if: always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success'
        timeout-minutes: 2
        run: node tests/fixtures/cef/mac_intel_owned_source_carrier.mjs
      - name: Retain only the owned metadata proof
        if: always() && steps.proof.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-owned-source-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.proof.outputs.root }}/proof.json
            ${{ steps.proof.outputs.root }}/carrier.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
      - name: Retain the independently labeled Intel scratch codec proof
        if: always() && steps.intel.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-intel-owned-source-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.intel.outputs.root }}/proof.json
            ${{ steps.intel.outputs.root }}/carrier.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
      - name: Retain the independently labeled Python candidate proof
        if: always() && steps.package.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-mac-python-package-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.root }}/proof.json
            ${{ steps.package.outputs.root }}/external.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
