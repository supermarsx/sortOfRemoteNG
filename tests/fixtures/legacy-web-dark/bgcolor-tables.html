<!doctype html>
<html data-doc="bgcolor-tables">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Network Settings</title>
  </head>
  <body
    bgcolor="#ffffff"
    text="#000000"
    link="#0000ff"
    vlink="#800080"
    background="legacy-logo.gif"
  >
    <table
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="6"
      bgcolor="#ffffff"
    >
      <tr>
        <td bgcolor="#ffffff">
          <img id="sorng-logo" src="legacy-logo.gif" width="16" height="16" />
          <font face="Arial" size="2" color="#000000"><b>Network</b></font>
        </td>
      </tr>
    </table>
    <table
      id="sorng-swatch"
      width="420"
      height="170"
      border="1"
      cellspacing="0"
      cellpadding="5"
      bgcolor="#ffffff"
      bordercolor="#cccccc"
    >
      <tr bgcolor="#e6e6e6">
        <td width="170" bgcolor="#e6e6e6">
          <font face="Arial" size="2" color="#000000">Mode</font>
        </td>
        <td id="sorng-cell" bgcolor="#ffffff">
          <font id="sorng-ink" face="Arial" size="2" color="#000000">DHCP</font>
        </td>
      </tr>
      <tr>
        <td bgcolor="#e6e6e6">
          <font face="Arial" size="2" color="#000000">Static IP</font>
        </td>
        <td bgcolor="#ffffff">
          <input
            id="sorng-input"
            type="text"
            size="18"
            value="192.0.2.24"
            style="background-color: #ffffff; color: #000000"
          />
        </td>
      </tr>
      <tr>
        <td bgcolor="#e6e6e6">
          <font face="Arial" size="2" color="#000000">Subnet Mask</font>
        </td>
        <td bgcolor="#ffffff">
          <font face="Arial" size="2" color="#000000">255.255.255.0</font>
        </td>
      </tr>
      <tr>
        <td bgcolor="#e6e6e6">
          <font face="Arial" size="2" color="#000000">Gateway</font>
        </td>
        <td bgcolor="#ffffff">
          <font face="Arial" size="2" color="#666666">192.0.2.1</font>
        </td>
      </tr>
      <tr>
        <td colspan="2" align="right" bgcolor="#ffffff">
          <input type="button" value="Confirm" /> &nbsp;
          <input type="button" value="Cancel" />
        </td>
      </tr>
    </table>
  </body>
</html>
