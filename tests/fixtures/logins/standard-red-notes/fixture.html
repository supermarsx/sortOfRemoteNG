<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic notes account sign-in</title>
  </head>
  <body>
    <div id="account-menu">
      <div><button type="button">Back</button></div>
      <div>
        <div><input type="email" autocomplete="off" /></div>
        <div>
          <input type="password" autocomplete="off" /><button type="button">
            Show
          </button>
        </div>
        <div><input type="text" autocomplete="off" /></div>
        <button type="button">Continue</button>
        <label
          ><input type="checkbox" name="is-ephemeral" />Stay signed in</label
        >
      </div>
    </div>
  </body>
</html>
