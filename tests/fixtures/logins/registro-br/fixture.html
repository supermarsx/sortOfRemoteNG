<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: Registro.br sign-in form (inferred)</title>
  </head>
  <body>
    <div id="app">
      <div class="page">
        <form>
          <h2></h2>
          <fieldset>
            <div class="field">
              <input
                id="login.user"
                name="login.user"
                type="text"
                autocomplete="username"
              />
            </div>
            <div class="field">
              <input
                id="login.password"
                name="login.password"
                type="password"
                autocomplete="current-password"
                minlength="6"
              />
            </div>
          </fieldset>
          <button class="bt bt-next"></button>
        </form>
      </div>
    </div>
  </body>
</html>
