<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign-in fixture</title>
  </head>
  <body>
    <form>
      <input
        id="email"
        name="email"
        type="text"
        data-testid="sign-in-email"
        required
      />
      <input
        id="password"
        name="password"
        type="password"
        data-testid="sign-in-password"
        required
      />
      <button data-testid="sign-in-button">Sign in</button>
    </form>
  </body>
</html>
