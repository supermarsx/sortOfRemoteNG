<!doctype html><title>TP-Link EAP login</title>
<form id="form-login" method="post" action="/">
  <input id="login-username" name="username" type="text" /><span
    class="password-wrap"
    ><input class="password-text password-hidden" type="password" /><input
      id="login-password"
      name="password"
      class="hidden"
      type="password" /></span
  ><button id="login-btn" type="button">LOGIN</button>
</form>
