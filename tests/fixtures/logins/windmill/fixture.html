<!doctype html>
<html>
  <body>
    <div>
      <div>
        <label for="synthetic-email">Email</label
        ><input id="synthetic-email" type="email" autocomplete="username" />
      </div>
      <div>
        <label for="synthetic-password">Password</label>
        <div>
          <input
            id="synthetic-password"
            type="password"
            autocomplete="current-password"
          />
        </div>
      </div>
      <button type="button">Log in</button>
    </div>
  </body>
</html>
