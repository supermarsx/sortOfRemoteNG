<!doctype html>
<html>
  <body>
    <div>
      <div>
        <label for="email">Email</label>
        <div>
          <input type="email" id="email" autocomplete="email" />
        </div>
      </div>
      <div>
        <label for="password">Password</label>
        <div>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
          />
        </div>
      </div>
      <div>
        <button type="button">Sign in</button>
      </div>
    </div>
  </body>
</html>
