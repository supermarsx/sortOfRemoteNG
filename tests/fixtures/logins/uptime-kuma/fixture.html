<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: Uptime Kuma login</title>
  </head>
  <body>
    <main>
      <div class="form-container">
        <div class="form">
          <form class="pt-3">
            <div class="form-floating">
              <input
                id="floatingInput"
                type="text"
                class="form-control"
                autocomplete="username"
                required
              />
              <label for="floatingInput">Account</label>
            </div>
            <div class="mt-3">
              <div class="input-group mb-3">
                <input
                  type="password"
                  class="form-control"
                  maxlength="255"
                  autocomplete="current-password"
                  required
                />
              </div>
            </div>
            <div class="form-check">
              <input
                id="remember"
                type="checkbox"
                value="remember-me"
                class="form-check-input"
              />
              <label class="form-check-label" for="remember">Keep</label>
            </div>
            <button class="w-100 btn btn-primary" type="submit">
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
