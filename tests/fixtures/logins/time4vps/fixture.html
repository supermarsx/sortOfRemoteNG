<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body class="cmd-clientarea">
    <form id="login-widget-form" action method="post">
      <input id="login-widget-user" name="username" type="text" required />
      <input
        id="login-widget-password"
        name="password"
        type="password"
        autocomplete="off"
        required
      />
      <input name="action" type="hidden" />
      <input name="security_token" type="hidden" />
      <button id="login-widget-submit" type="submit"></button>
    </form>
  </body>
</html>
