<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: Adobe sign-in, password stage</title>
  </head>
  <body>
    <form id="PasswordForm">
      <div hidden>
        <input type="email" name="username" autocomplete="username" readonly />
      </div>
      <input
        id="PasswordPage-PasswordField"
        name="password"
        type="password"
        autocomplete="current-password"
      />
      <button data-id="PasswordPage-ContinueButton" type="submit">
        Continue
      </button>
    </form>
  </body>
</html>
