<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: password step</title>
  </head>
  <body>
    <div id="authportal-center-section">
      <form
        name="signIn"
        method="post"
        novalidate
        action="/ap/signin"
        class="auth-validate-form"
      >
        <!-- The identifier is carried over in fields that are not displayed. -->
        <input type="hidden" name="email" id="ap_email" />
        <input
          type="text"
          id="ap-credential-autofill-hint"
          name="email"
          autocomplete="email"
          class="hide"
          hidden
        />
        <input
          type="password"
          id="ap_password"
          name="password"
          autocomplete="current-password"
          maxlength="1024"
        />
        <span id="auth-signin-button">
          <span class="a-button-inner">
            <input
              id="signInSubmit"
              class="a-button-input"
              type="submit"
              aria-labelledby="auth-signin-button-announce"
            />
          </span>
        </span>
      </form>
      <!-- A separate form whose button reuses the id of the identifier step's
           wrapper. It starts a passkey sign-in and is never a step target. -->
      <form name="signInWithPasskeyButton" method="post" action="">
        <span id="auth-signin-via-passkey-btn">
          <span class="a-button-inner">
            <button id="continue" class="a-button-text" type="button"></button>
          </span>
        </span>
      </form>
    </div>
  </body>
</html>
