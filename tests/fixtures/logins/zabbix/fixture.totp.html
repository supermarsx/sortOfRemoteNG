<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: Zabbix verification code</title>
  </head>
  <body>
    <main>
      <form method="post" accept-charset="utf-8">
        <ul>
          <li>
            <label for="verification_code">Code</label>
            <input
              type="text"
              id="verification_code"
              name="verification_code"
              value=""
              maxlength="255"
              data-field-type="text-box"
              autofocus
            />
          </li>
          <li>
            <button type="submit" id="enter" name="enter">Continue</button>
          </li>
        </ul>
      </form>
    </main>
  </body>
</html>
