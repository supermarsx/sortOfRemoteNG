<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic fixture: NetBox log in</title>
  </head>
  <body>
    <div class="card card-md">
      <div class="card-body">
        <form action="/login/" method="post">
          <div class="form-group mb-3">
            <label for="id_username" class="form-label">Account</label>
            <input
              type="text"
              name="username"
              autofocus
              autocapitalize="none"
              autocomplete="username"
              required
              id="id_username"
            />
          </div>
          <div class="form-group">
            <label for="id_password" class="form-label">Secret</label>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              id="id_password"
            />
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">
              Continue
            </button>
          </div>
        </form>
      </div>
      <div class="card-body">
        <form method="post" class="sso-login-form">
          <button type="submit" class="btn w-100">Other</button>
        </form>
      </div>
    </div>
  </body>
</html>
