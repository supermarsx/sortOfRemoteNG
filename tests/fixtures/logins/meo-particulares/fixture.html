<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <form id="MainForm" method="post" action="/AuthorizeService/authorize.aspx">
      <input type="hidden" name="__EVENTTARGET" />
      <input type="hidden" name="__EVENTARGUMENT" />
      <input type="hidden" name="__VIEWSTATE" />
      <input type="hidden" name="__VIEWSTATEGENERATOR" />
      <input type="hidden" name="__EVENTVALIDATION" />
      <input type="hidden" name="npu" />
      <input type="hidden" name="WebSSOLabelUsernameValue" />
      <label
        for="ContentPlaceHolder1_LoginTemplate_Template_WebSSOUsernameTextBox"
      >
      </label>
      <input
        id="ContentPlaceHolder1_LoginTemplate_Template_WebSSOUsernameTextBox"
        type="email"
      />
      <label
        for="ContentPlaceHolder1_LoginTemplate_Template_WebSSOPasswordTextBox"
      >
      </label>
      <input
        id="ContentPlaceHolder1_LoginTemplate_Template_WebSSOPasswordTextBox"
        type="password"
        autocomplete="off"
      />
      <div
        id="ContentPlaceHolder1_LoginTemplate_Template_WebSSOCaptchaControl_CaptchaContainer"
        class="h-captcha"
      ></div>
      <textarea name="g-recaptcha-response" hidden> </textarea>
      <textarea name="h-captcha-response" hidden> </textarea>
      <button
        id="ContentPlaceHolder1_LoginTemplate_Template_WebSSOSubmitButton"
        name="SubmitButton"
        type="submit"
      ></button>
    </form>
  </body>
</html>
