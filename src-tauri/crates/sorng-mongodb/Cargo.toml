[package]
publish = false
name = "sorng-mongodb"
version.workspace = true
edition = "2021"
description = "MongoDB connection, document, index, and server management on the official driver."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
zeroize = { workspace = true }
futures = { workspace = true }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "dns-resolver", "bson-3", "compat-3-3-0"] }
bson = { version = "3", default-features = false, features = ["serde_json-1"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
