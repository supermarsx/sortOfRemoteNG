[package]
name = "sorng-file-viewer-host"
version.workspace = true
edition = "2021"
publish = false
description = "Isolated OS WebView file viewer without application commands (Windows initial support)"
build = "build.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
tao = "=0.35.3"
wry = { version = "=0.55.1", default-features = false, features = ["os-webview"] }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
url = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
sorng-protocols = { path = "../sorng-protocols" }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
base64 = { workspace = true }
rcgen = "0.12"

[[test]]
name = "native_frame_navigation"
harness = false

# t95 W0b: disposable WebView2 measurement of the legacy-page website frame.
[[test]]
name = "native_legacy_frame_probe"
harness = false

# Explicit opt-in live, anonymous production-proxy/WebView2 acceptance probe.
[[test]]
name = "native_live_browser"
harness = false

# Explicit local-only real HTTPS/private CONNECT engineering probe. Not a
# production host-readiness report or a public provider acceptance test.
[[test]]
name = "native_real_origin"
harness = false
