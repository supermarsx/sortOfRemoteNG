[package]
publish = false
name = "sorng-sqlite"
version.workspace = true
edition = "2021"
description = "SQLite connection management, query execution, schema introspection, import/export, and session lifecycle."

[dependencies]
sorng-core = { path = "../sorng-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio"] }
thiserror = { workspace = true }

[features]
# Source and ordinary developer builds remain self-contained. Windows release
# packaging explicitly selects `unbundled` after staging sqlite3.dll.
default = ["bundled"]
bundled = ["sqlx/sqlite"]
unbundled = ["sqlx/sqlite-unbundled"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
