[package]
publish = false
name = "sorng-sftp"
version.workspace = true
edition = "2021"
description = "Comprehensive SFTP file-transfer and remote filesystem management"

[dependencies]
sorng-core = { path = "../sorng-core" }
# t62: SFTP host keys are memorized in the per-database Trust Center, the same
# `ssh` records core SSH writes, so one accepted key covers both protocols.
sorng-storage = { path = "../sorng-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ssh2 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
lazy_static = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ssh-key = { version = "0.6", features = ["rsa", "ed25519", "encryption", "std", "getrandom"] }
secrecy = { version = "0.8", features = ["serde"] }
glob = "0.3"
filetime = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Opt-in marker for e2e tests that talk to the openssh docker container
# defined in `e2e/docker-compose.yml` (see tests/golden_path.rs).
docker-e2e = []
