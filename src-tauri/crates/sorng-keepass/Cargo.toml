[package]
publish = false
name = "sorng-keepass"
version.workspace = true
edition = "2021"
description = "Comprehensive KeePass KDBX database integration: entries, groups, attachments, password generation, auto-type, import/export, search, merge"

[dependencies]
sorng-core = { path = "../sorng-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
lazy_static = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
tempfile = { workspace = true }
hmac = "0.12"
sha1 = "0.10"
csv = "1.3"
quick-xml = { version = "0.41", features = ["serialize"] }
keepass = { version = "=0.13.17", features = ["save_kdbx4"] }
rust-argon2 = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
