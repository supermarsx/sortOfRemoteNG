[package]
publish = false
name = "sorng-synology"
version.workspace = true
edition = "2021"
description = "Synology NAS management — DSM 6.x/7.x via the SYNO.API REST interface (system, storage, file station, docker, surveillance, backup, and more)"

[dependencies]
sorng-quickconnect = { path = "../sorng-quickconnect" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "multipart", "stream"] }
base64 = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
# DSM 7 secure login handshake (Noise_IK_25519_ChaChaPoly_BLAKE2b). Only the
# primitives that pattern needs: no AES-GCM, SHA-2, ring or `std` (which would
# pull in ring). getrandom supplies the per-login static and ephemeral keys.
snow = { version = "0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }

[dev-dependencies]
rcgen = "0.12"
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security_Authorization"] }
