[package]
publish = false
name = "sorng-protocols"
version.workspace = true
edition = "2021"
description = "VNC, Telnet, Rlogin, Raw Socket, FTP, DB, and HTTP protocols"

[features]
default = []
# Compatibility alias: HTTPS inspection always parses peer certificates, including lean.
tls-cert-details = []

[dependencies]
sorng-quickconnect = { path = "../sorng-quickconnect" }
sorng-core = { path = "../sorng-core" }
sorng-socket-transport = { path = "../sorng-socket-transport" }
# t96 Route A: the Yealink servlet login contract (page grammar, RSA/AES
# password wrapper, response classification) is implemented ONCE, in
# `sorng_voip_phone::yealink_servlet_auth`, and shared with the native phone
# driver so the proxy and the driver can never drift. The edge is one-way —
# sorng-voip-phone depends on sorng-tls-trust/sorng-storage only, never on this
# crate — and adds no new external package.
sorng-voip-phone = { path = "../sorng-voip-phone" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
vnc-rs = "0.5"
suppaftp = "4.5"
ssh2 = { workspace = true }
sqlx = { workspace = true, features = ["mysql", "runtime-tokio", "tls-rustls"] }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
md-5 = "0.10"
socket2 = "0.6"
reqwest = { workspace = true, features = ["cookies", "blocking"] }
# Same maintained cookie parser used by reqwest; bounded per-origin attempt stores.
cookie_store = { version = "0.22", default-features = false }
# Static public/private suffix rules for safe loopback cookie-domain projection.
# No runtime list fetches or background requests.
psl = "=2.1.232"
regex = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
x509-parser = "0.18"
base64 = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
futures-util = "0.3"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
sha1 = "0.10"
flate2 = "1.0"
hex = { workspace = true }
zeroize = { workspace = true }
url = "2"
# P3: AppHandle + Emitter for the themed-auth POST handler in
# `http.rs` — emits `proxy-credentials-applied` so the frontend can
# offer to persist creds the user typed into the inline login form.
tauri = { workspace = true }

[dev-dependencies]
# Synthetic local CA/leaf fixtures only; no OS trust installation or public hosts.
rcgen = "0.12"
# The Yealink mock phone in `http_yealink_login_tests.rs` really decrypts the
# login body, the way `decodeRsaAesLogin` does in the e2e fixture, so the test
# proves the POST is bound to the session id the login-page GET issued. All
# three are already locked at these versions by sibling crates — no new package.
rsa = "0.9"
aes = "0.8"
cbc = "0.1"
