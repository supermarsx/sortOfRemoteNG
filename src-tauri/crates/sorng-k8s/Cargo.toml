[package]
publish = false
name = "sorng-k8s"
version.workspace = true
edition = "2021"
description = "Kubernetes cluster management (contexts, namespaces, pods, deployments, services, configmaps, secrets, ingress, jobs, RBAC, Helm, logs, exec, port-forward, events, metrics)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
base64 = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
# Server-certificate decisions for `insecureSkipVerify` clusters route through
# the Trust Center (TOFU / explicit AlwaysTrust override) instead of a blind
# `danger_accept_invalid_certs(true)` (t62). rustls + rustls-pemfile are needed
# directly so the preconfigured config keeps the mTLS client identity, which
# reqwest drops for preconfigured TLS backends.
sorng-tls-trust = { path = "../sorng-tls-trust" }
rustls = { workspace = true }
rustls-pemfile = "2"
