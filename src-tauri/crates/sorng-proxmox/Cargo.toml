[package]
publish = false
name = "sorng-proxmox"
version.workspace = true
edition = "2021"
description = "Proxmox VE management (nodes, QEMU VMs, LXC containers, storage, network, cluster, tasks, backups, firewall, pools, Ceph, SDN, console, HA, metrics)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
base64 = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
rustls-native-certs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio-rustls = { workspace = true }
# termproxy console relay (console_ws.rs): WebSocket client + frontend events.
tokio-tungstenite = { workspace = true }
sorng-core = { path = "../sorng-core" }
# Certificate metadata for `proxmox_probe_certificate` (same pin as sorng-tls-trust).
x509-parser = "0.18"
# Pure RFC 6238 generator for the optional `totpSecret` auto-TFA path.
sorng-totp = { path = "../sorng-totp" }

[dev-dependencies]
# In-process TLS mock PVE (tests/mock_pve.rs) — all already in the workspace lock.
rcgen = { version = "0.12", features = ["pem"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
