[package]
publish = false
name = "sorng-winmgmt"
version.workspace = true
edition = "2021"
description = "Remote Windows Management — Services, Event Viewer, Processes, Performance Monitoring via WMI/WinRM/DCOM"

[dependencies]
sorng-core = { path = "../sorng-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "stream"] }
sorng-tls-trust = { path = "../sorng-tls-trust" }
sorng-storage = { path = "../sorng-storage" }
base64 = { workspace = true }
quick-xml = { version = "0.41", features = ["serialize"] }
url = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
md-5 = "0.10"
hex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# `install_runtime_for_tests` needs a temp `databases/` dir for the
# process-global trust runtime the TOFU verifier resolves through.
tempfile = { workspace = true }
