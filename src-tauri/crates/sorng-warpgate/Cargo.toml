[package]
name = "sorng-warpgate"
version.workspace = true
edition = "2021"
rust-version = "1.77.2"
description = "Warpgate bastion host integration crate for SortOfRemoteNG"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "blocking"] }
url = { workspace = true }
sorng-tls-trust = { path = "../sorng-tls-trust" }
sorng-storage = { path = "../sorng-storage" }

[dev-dependencies]
# `install_runtime_for_tests` needs a temp `databases/` dir for the
# process-global trust runtime the TOFU verifier resolves through.
tempfile = { workspace = true }
