[package]
publish = false
name = "sorng-voip-phone"
version.workspace = true
edition = "2021"
description = "VoIP desk-phone web-admin driver (Yealink T2x: login, status, reboot, web-UI auto-login hints)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
url = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
# Already locked in the workspace (sorng-auth / sorng-smtp / sorng-ssh) — no new lockfile entry.
rsa = "0.9"
rand = { workspace = true }
sorng-tls-trust = { path = "../sorng-tls-trust" }
sorng-storage = { path = "../sorng-storage" }

[dev-dependencies]
# Installs the process-global ring crypto provider so `build_tofu_client` can
# construct a rustls ClientConfig under `cargo test`.
rustls = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }
