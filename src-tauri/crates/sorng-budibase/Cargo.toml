[package]
name = "sorng-budibase"
version.workspace = true
edition = "2021"
rust-version = "1.77.2"
description = "Budibase low-code platform integration crate for SortOfRemoteNG"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "blocking"] }
url = { workspace = true }
# Server certificates are decided by the shared Trust Center TOFU verifier
# instead of a config-gated `danger_accept_invalid_certs(true)` (t62).
sorng-tls-trust = { path = "../sorng-tls-trust" }

[dev-dependencies]
# The test binary must install the ring crypto provider itself; in the app
# `sorng-app` does it at startup.
rustls = { workspace = true, features = ["ring"] }
