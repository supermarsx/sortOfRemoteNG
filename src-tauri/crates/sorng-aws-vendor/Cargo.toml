[package]
publish = false
name = "sorng-aws-vendor"
version.workspace = true
edition = "2021"
description = "Grouped Rust vendor dependencies for the AWS stack"

[lib]
# Ordinary Rust consumers use this rlib. There is no runtime-loading or bundle
# contract for a companion Rust DLL, so do not emit an unused dynamic output.
crate-type = ["rlib"]

[dependencies]
quick-xml = { version = "0.41", features = ["serialize"] }
percent-encoding = "2.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
