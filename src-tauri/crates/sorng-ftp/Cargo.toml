[package]
publish = false
name = "sorng-ftp"
version.workspace = true
edition = "2021"
description = "Comprehensive FTP/FTPS client — full RFC 959/2228/4217/3659 implementation with TLS, transfer queuing, progress tracking, and LIST parsing"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
# FTPS server certificates are decided by the shared Trust Center TOFU verifier
# instead of a blind accept-anything verifier (t62). The native root store now
# lives inside sorng-tls-trust's webpki delegate, so this crate no longer loads
# it directly.
sorng-tls-trust = { path = "../sorng-tls-trust" }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
glob = "0.3"
url = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
docker-e2e = []
