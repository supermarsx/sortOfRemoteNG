[package]
publish = false
name = "sorng-compression-vendor"
version.workspace = true
edition = "2021"
description = "Grouped Rust vendor dependencies for compression (zstd + flate2)"

[lib]
# This Rust wrapper is not a runtime DLL boundary. Native zstd linkage remains
# controlled by the unchanged dependencies and the selected build environment.
crate-type = ["rlib"]

[dependencies]
zstd = "0.13"
flate2 = "1.0"
