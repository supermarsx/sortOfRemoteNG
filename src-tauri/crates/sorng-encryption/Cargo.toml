[package]
publish = false
name = "sorng-encryption"
version.workspace = true
edition = "2021"
description = "Application-wide encryption-at-rest orchestration: master DEK, per-artifact sub-keys, file envelope codec, unlock state"

[dependencies]
# Crypto primitives.
aes-gcm = { workspace = true }
chacha20poly1305 = "0.10"
# Advanced inner-database payload algorithms only. Compatible cipher 0.4 / aead 0.5.
eax = { version = "=0.5.0", default-features = false, features = ["alloc"] }
twofish = { version = "=0.7.1", features = ["zeroize"] }
serpent = { version = "=0.5.0", features = ["zeroize"] }
hkdf = "0.12"
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = "1.7"
argon2 = "0.5"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

# Log redaction
regex = { workspace = true }

# Async
tokio = { workspace = true }

# Global logger facade — adapter in log_adapter.rs implements log::Log.
# `std` is needed for `set_boxed_logger` (atomic Box install).
log = { workspace = true, features = ["std"] }
tempfile = "3"

# Vault for master DEK storage + password-wrap envelope
sorng-vault = { path = "../sorng-vault" }

# Tauri command surface
tauri = { workspace = true }
tauri-plugin-fs = "=2.5.1"

[dev-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
