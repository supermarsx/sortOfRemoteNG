[package]
publish = false
name = "sorng-secure-clip"
version.workspace = true
edition = "2021"
description = "Secure clipboard with auto-clear, one-time paste, credential field copying, and paste-to-terminal for sortOfRemoteNG"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
