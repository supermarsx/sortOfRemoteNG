[package]
name = "sorng-cef-http3-acceptance"
version = "0.1.0"
edition = "2021"
publish = false

# Independent, opt-in synthetic fixture; never part of the application graph.
[workspace]

[dependencies]
bytes = "=1.12.1"
http = "=1.5.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = "=0.12.1"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"

[patch.crates-io]
# Reuse the existing workspace's additive SSH3 protocol-token patch.
h3 = { path = "../../../../vendor/h3-ssh3" }
