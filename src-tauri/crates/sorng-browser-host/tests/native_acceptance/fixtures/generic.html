<!doctype html><html><head><meta charset="utf-8"><title>Local synthetic login</title></head>
<body style="margin:0;background:white;color:black"><h1>Local synthetic login</h1>
<form method="post" action="/submitted"><input name="username" autocomplete="username"><input name="password" type="password" autocomplete="current-password"><button type="submit">Sign in</button></form>
<iframe src="https://frame.test/frame"></iframe>
<script>
const evidence={origin:location.origin,secure:isSecureContext,top:top===window,tauriAbsent:typeof window.__TAURI_INTERNALS__==='undefined',httpOnlyHidden:!document.cookie.includes('native_fixture'),domBackground:getComputedStyle(document.body).backgroundColor,prefersDark:matchMedia('(prefers-color-scheme: dark)').matches};
let frame=false, login=false;
const report=()=>{if(frame&&login)fetch('/proof',{method:'POST',body:JSON.stringify({...evidence,completed:'generic'})});};
addEventListener('message',e=>{if(e.origin==='https://frame.test'&&e.source===document.querySelector('iframe').contentWindow){evidence.iframe=e.data;frame=true;report();}});
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const f=e.target;evidence.syntheticLogin=f.username.value==='synthetic@example.test'&&f.password.value==='synthetic-local-only';login=true;report();});
localStorage.setItem('fixture','one');document.cookie='script_fixture=one; Secure; SameSite=Strict; Path=/';
setInterval(()=>fetch('/pulse').catch(()=>{}),100);
</script></body></html>
