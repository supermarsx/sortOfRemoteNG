[package]
publish = false
name = "sorng-commands-ops"
version.workspace = true
edition = "2021"
description = "Compatibility facade for bounded operations command registrars"

[dependencies]
sorng-commands-ops-system = { path = "../sorng-commands-ops-system" }
sorng-commands-ops-identity = { path = "../sorng-commands-ops-identity" }
sorng-commands-ops-web = { path = "../sorng-commands-ops-web" }
sorng-commands-ops-network = { path = "../sorng-commands-ops-network" }
sorng-commands-ops-databases = { path = "../sorng-commands-ops-databases" }
sorng-commands-ops-monitoring = { path = "../sorng-commands-ops-monitoring" }
sorng-commands-ops-platform = { path = "../sorng-commands-ops-platform" }
sorng-commands-ops-messaging = { path = "../sorng-commands-ops-messaging" }
sorng-commands-ops-orchestration = { path = "../sorng-commands-ops-orchestration" }
tauri = { workspace = true }

[features]
# Forwarded from the top-level app crate via `sorng-commands-ops?/kafka` so
# that enabling `kafka` / `kafka-dynamic` / `kafka-static` on the app crate
# also compiles the 39 `kafka_*` Tauri command handlers in the messaging
# child. Without this forwarding hop the commands would remain unwired even
# when the app enables Kafka.
kafka = ["sorng-commands-ops-messaging/kafka"]
